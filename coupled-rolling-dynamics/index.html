html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;coupled-rolling-dynamics&quot; class=&quot;crd-lab&quot;&gt;
  &lt;div class=&quot;viz-row crd-toolbar&quot;&gt;
    &lt;div class=&quot;viz-row&quot;&gt;

      &lt;input class=&quot;form-range&quot; id=&quot;crd-curvature&quot; type=&quot;range&quot; min=&quot;0.08&quot; max=&quot;0.32&quot; step=&quot;0.01&quot; value=&quot;0.18&quot;&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;coupled-rolling-dynamics&#x27;);
  if (!root || root.dataset.initialized === &#x27;true&#x27;) return;
  root.dataset.initialized = &#x27;true&#x27;;

  const canvas = document.getElementById(&#x27;crd-canvas&#x27;);
  const stage = document.getElementById(&#x27;crd-stage&#x27;);
  const error = document.getElementById(&#x27;crd-error&#x27;);
  const playButton = document.getElementById(&#x27;crd-play&#x27;);
  const releaseButton = document.getElementById(&#x27;crd-release&#x27;);
  const stepButton = document.getElementById(&#x27;crd-step&#x27;);
  const presetSelect = document.getElementById(&#x27;crd-preset&#x27;);
  const clockOutput = document.getElementById(&#x27;crd-clock&#x27;);
  const contactOutput = document.getElementById(&#x27;crd-contact&#x27;);
  const liveOutput = document.getElementById(&#x27;crd-live&#x27;);
  const energyOutput = document.getElementById(&#x27;crd-energy&#x27;);
  const energyDetail = document.getElementById(&#x27;crd-energy-detail&#x27;);
  const torqueOutput = document.getElementById(&#x27;crd-torque&#x27;);
  const torqueDetail = document.getElementById(&#x27;crd-torque-detail&#x27;);
  const tractionOutput = document.getElementById(&#x27;crd-traction&#x27;);
  const tractionDetail = document.getElementById(&#x27;crd-traction-detail&#x27;);
  const energyKey = document.getElementById(&#x27;crd-energy-key&#x27;);
  const labelA = document.getElementById(&#x27;crd-label-a&#x27;);
  const labelR = document.getElementById(&#x27;crd-label-r&#x27;);
  const labelB = document.getElementById(&#x27;crd-label-b&#x27;);
  const driveLabel = document.getElementById(&#x27;crd-drive-label&#x27;);

  const controls = {
    curvature: document.getElementById(&#x27;crd-curvature&#x27;),
    stiffness: document.getElementById(&#x27;crd-stiffness&#x27;),
    damping: document.getElementById(&#x27;crd-damping&#x27;),
    friction: document.getElementById(&#x27;crd-friction&#x27;)
  };
  const controlValues = {
    curvature: document.getElementById(&#x27;crd-curvature-value&#x27;),
    stiffness: document.getElementById(&#x27;crd-stiffness-value&#x27;),
    damping: document.getElementById(&#x27;crd-damping-value&#x27;),
    friction: document.getElementById(&#x27;crd-friction-value&#x27;)
  };

  const gl = canvas.getContext(&#x27;webgl&#x27;, {
    antialias: true,
    alpha: true,
    premultipliedAlpha: false
  });

  if (!gl) {
    canvas.hidden = true;
    error.hidden = false;
    return;
  }

  const vertexSource = `
    attribute vec2 a_position;
    attribute vec4 a_color;
    varying vec4 v_color;
    void main() {
      gl_Position = vec4(a_position, 0.0, 1.0);
      v_color = a_color;
    }
  `;

  const fragmentSource = `
    precision mediump float;
    varying vec4 v_color;
    void main() {
      gl_FragColor = v_color;
    }
  `;

  function compileShader(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
      const message = gl.getShaderInfoLog(shader);
      gl.deleteShader(shader);
      throw new Error(message || &#x27;Shader compilation failed&#x27;);
    }
    return shader;
  }

  function createProgram() {
    const program = gl.createProgram();
    gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vertexSource));
    gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fragmentSource));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(program) || &#x27;WebGL program link failed&#x27;);
    }
    return program;
  }

  let program;
  try {
    program = createProgram();
  } catch (shaderError) {
    canvas.hidden = true;
    error.hidden = false;
    error.textContent = &#x27;The WebGL renderer could not start.&#x27;;
    return;
  }

  gl.useProgram(program);
  const positionLocation = gl.getAttribLocation(program, &#x27;a_position&#x27;);
  const colorLocation = gl.getAttribLocation(program, &#x27;a_color&#x27;);
  const positionBuffer = gl.createBuffer();
  const colorBuffer = gl.createBuffer();
  gl.enableVertexAttribArray(positionLocation);
  gl.enableVertexAttribArray(colorLocation);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  const g0 = 9.81;
  const fixedDt = 1 / 240;
  const impactRestitution = 0.06;
  const maxHistorySeconds = 8;
  const scenarioData = {
    exchange: {
      a: 0.18, k: 1.40, c: 0.08, mu: 0.65, ratio: 1,
      mA: 4.5, rAOuter: 0.55, rAInner: 0.36,
      mRotor: 1.2, rRotor: 0.23, mB: 2.8, rB: 0.42,
      xA: -1.55, xB: 1.72, vA: 0, vB: 0, psi: 0, omega: 0
    },
    damped: {
      a: 0.20, k: 2.20, c: 0.48, mu: 0.72, ratio: 1,
      mA: 4.5, rAOuter: 0.55, rAInner: 0.36,
      mRotor: 1.2, rRotor: 0.23, mB: 2.8, rB: 0.42,
      xA: -1.62, xB: 1.78, vA: 0, vB: 0, psi: 0, omega: 0
    },
    heavy: {
      a: 0.16, k: 1.80, c: 0.12, mu: 0.68, ratio: 1,
      mA: 4.5, rAOuter: 0.55, rAInner: 0.37,
      mRotor: 3.3, rRotor: 0.27, mB: 2.8, rB: 0.42,
      xA: -1.68, xB: 1.60, vA: 0, vB: 0, psi: 0, omega: 0
    },
    reverse: {
      a: 0.18, k: 1.65, c: 0.10, mu: 0.70, ratio: -1,
      mA: 4.5, rAOuter: 0.55, rAInner: 0.36,
      mRotor: 1.2, rRotor: 0.23, mB: 2.8, rB: 0.42,
      xA: -1.48, xB: 1.76, vA: 0, vB: 0, psi: 0, omega: 0
    },
    traction: {
      a: 0.25, k: 3.10, c: 0.13, mu: 0.18, ratio: 1,
      mA: 4.5, rAOuter: 0.55, rAInner: 0.36,
      mRotor: 1.2, rRotor: 0.23, mB: 2.8, rB: 0.42,
      xA: -1.62, xB: 1.82, vA: 0, vB: 0, psi: 0.35, omega: -1.4
    }
  };

  let params = { ...scenarioData.exchange };
  let state = new Float64Array(7);
  let anchors = { xA: params.xA, xB: params.xB, deltaA: 0, deltaB: 0 };
  let playing = !window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
  let simulationTime = 0;
  let accumulator = 0;
  let lastFrameTime = performance.now();
  let lastUiUpdate = -1;
  let energyReference = 1;
  let collisionFlash = 0;
  let history = [];
  let nextHistoryTime = 0;
  let dragTarget = null;
  let worldView = { width: 1, height: 1, scale: 100, baseline: 1 };
  let palette = null;

  function thetaPrimitive(x, radius) {
    const a = params.a;
    if (Math.abs(a) &lt; 1e-8) return -x / radius;
    const u = 2 * a * x;
    const h = Math.sqrt(1 + u * u);
    const arc = 0.5 * x * h + Math.asinh(u) / (4 * a);
    return Math.atan(u) - arc / radius;
  }

  function rollingAngle(x, radius, anchorX) {
    return thetaPrimitive(x, radius) - thetaPrimitive(anchorX, radius);
  }

  function rollingGeometry(x, radius, massFactor) {
    const a = params.a;
    const u = 2 * a * x;
    const h2 = 1 + u * u;
    const h = Math.sqrt(h2);
    const kappa = 2 * a / (h2 * h);
    const lambda = 1 - radius * kappa;
    const lambdaPrime = 12 * a * a * radius * u / (h2 * h2 * h);
    const d = 2 * a / h2 - h / radius;
    const dPrime = -2 * a * u / (radius * h) - 8 * a * a * u / (h2 * h2);
    const H = massFactor * lambda * lambda * h2;
    const HPrime = massFactor * (
      4 * a * u * lambda * lambda + 2 * h2 * lambda * lambdaPrime
    );
    return {
      x,
      contactX: x,
      contactY: a * x * x,
      centerX: x - radius * u / h,
      centerY: a * x * x + radius / h,
      tx: 1 / h,
      ty: u / h,
      nx: -u / h,
      ny: 1 / h,
      u,
      h,
      h2,
      kappa,
      lambda,
      d,
      dPrime,
      H,
      HPrime
    };
  }

  function systemTerms(sourceState) {
    const xA = sourceState[0];
    const vA = sourceState[1];
    const xB = sourceState[2];
    const vB = sourceState[3];
    const psi = sourceState[4];
    const omega = sourceState[5];
    const outerInertia = 0.5 * params.mA * (
      params.rAOuter * params.rAOuter + params.rAInner * params.rAInner
    );
    const rotorInertia = 0.5 * params.mRotor * params.rRotor * params.rRotor;
    const diskInertia = 0.5 * params.mB * params.rB * params.rB;
    const translatingMassA = params.mA + params.mRotor;
    const factorA = translatingMassA + outerInertia / (params.rAOuter * params.rAOuter);
    const factorB = params.mB + diskInertia / (params.rB * params.rB);
    const geomA = rollingGeometry(xA, params.rAOuter, factorA);
    const geomB = rollingGeometry(xB, params.rB, factorB);
    const thetaA = rollingAngle(xA, params.rAOuter, anchors.xA);
    const thetaB = rollingAngle(xB, params.rB, anchors.xB);
    const thetaDotA = geomA.d * vA;
    const thetaDotB = geomB.d * vB;
    const errorA = psi - thetaA - anchors.deltaA;
    const errorB = psi - params.ratio * thetaB - anchors.deltaB;
    const errorRateA = omega - thetaDotA;
    const errorRateB = omega - params.ratio * thetaDotB;
    const kA = params.k * 1.35;
    const kB = params.k;
    const cA = params.c * 1.15;
    const cB = params.c;
    const torqueA = kA * errorA + cA * errorRateA;
    const torqueB = kB * errorB + cB * errorRateB;
    return {
      xA, vA, xB, vB, psi, omega,
      outerInertia, rotorInertia, diskInertia, translatingMassA,
      geomA, geomB, thetaA, thetaB, thetaDotA, thetaDotB,
      errorA, errorB, errorRateA, errorRateB,
      kA, kB, cA, cB, torqueA, torqueB
    };
  }

  function derivative(sourceState) {
    const terms = systemTerms(sourceState);
    const { geomA, geomB } = terms;
    const accelerationA = (
      geomA.d * terms.torqueA
      - 0.5 * geomA.HPrime * terms.vA * terms.vA
      - terms.translatingMassA * g0 * geomA.lambda * geomA.u
    ) / geomA.H;
    const accelerationB = (
      params.ratio * geomB.d * terms.torqueB
      - 0.5 * geomB.HPrime * terms.vB * terms.vB
      - params.mB * g0 * geomB.lambda * geomB.u
    ) / geomB.H;
    const rotorAcceleration = (-terms.torqueA - terms.torqueB) / terms.rotorInertia;
    const dissipationRate = terms.cA * terms.errorRateA * terms.errorRateA
      + terms.cB * terms.errorRateB * terms.errorRateB;
    return new Float64Array([
      terms.vA,
      accelerationA,
      terms.vB,
      accelerationB,
      terms.omega,
      rotorAcceleration,
      dissipationRate
    ]);
  }

  function combine(base, increments, scale) {
    const result = new Float64Array(base.length);
    for (let i = 0; i &lt; base.length; i += 1) {
      result[i] = base[i] + increments[i] * scale;
    }
    return result;
  }

  function rk4Step(sourceState, dt) {
    const k1 = derivative(sourceState);
    const k2 = derivative(combine(sourceState, k1, dt * 0.5));
    const k3 = derivative(combine(sourceState, k2, dt * 0.5));
    const k4 = derivative(combine(sourceState, k3, dt));
    const next = new Float64Array(sourceState.length);
    for (let i = 0; i &lt; sourceState.length; i += 1) {
      next[i] = sourceState[i] + dt * (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]) / 6;
    }
    return next;
  }

  function centerVelocity(geometry, speed) {
    return {
      x: geometry.lambda * speed,
      y: geometry.lambda * geometry.u * speed
    };
  }

  function resolveBodyCollision() {
    for (let pass = 0; pass &lt; 2; pass += 1) {
      const terms = systemTerms(state);
      const dx = terms.geomB.centerX - terms.geomA.centerX;
      const dy = terms.geomB.centerY - terms.geomA.centerY;
      const distance = Math.max(1e-8, Math.hypot(dx, dy));
      const minimumDistance = params.rAOuter + params.rB;
      if (distance &gt;= minimumDistance) return;
      const lx = dx / distance;
      const ly = dy / distance;
      const centerDerivativeAX = terms.geomA.lambda;
      const centerDerivativeAY = terms.geomA.lambda * terms.geomA.u;
      const centerDerivativeBX = terms.geomB.lambda;
      const centerDerivativeBY = terms.geomB.lambda * terms.geomB.u;
      const jacobianA = -(lx * centerDerivativeAX + ly * centerDerivativeAY);
      const jacobianB = lx * centerDerivativeBX + ly * centerDerivativeBY;
      const inverseMass = jacobianA * jacobianA / terms.geomA.H
        + jacobianB * jacobianB / terms.geomB.H;
      if (inverseMass &lt; 1e-10) return;
      const relativeSpeed = jacobianA * state[1] + jacobianB * state[3];
      if (relativeSpeed &lt; 0) {
        const impulse = -(1 + impactRestitution) * relativeSpeed / inverseMass;
        const loss = 0.5 * (1 - impactRestitution * impactRestitution)
          * relativeSpeed * relativeSpeed / inverseMass;
        state[1] += impulse * jacobianA / terms.geomA.H;
        state[3] += impulse * jacobianB / terms.geomB.H;
        state[6] += Math.max(0, loss);
        collisionFlash = 1;
      }
      const overlap = minimumDistance - distance;
      const correction = Math.min(overlap + 1e-5, 0.08);
      state[0] += correction * jacobianA / terms.geomA.H / inverseMass;
      state[2] += correction * jacobianB / terms.geomB.H / inverseMass;
    }
  }

  function mechanicalEnergy(sourceState) {
    const terms = systemTerms(sourceState);
    const kinetic = 0.5 * terms.geomA.H * terms.vA * terms.vA
      + 0.5 * terms.geomB.H * terms.vB * terms.vB
      + 0.5 * terms.rotorInertia * terms.omega * terms.omega;
    const gravity = terms.translatingMassA * g0 * terms.geomA.centerY
      + params.mB * g0 * terms.geomB.centerY;
    const elastic = 0.5 * terms.kA * terms.errorA * terms.errorA
      + 0.5 * terms.kB * terms.errorB * terms.errorB;
    return kinetic + gravity + elastic;
  }

  function diagnostics() {
    const terms = systemTerms(state);
    const rates = derivative(state);
    const angularAccelerationA = terms.geomA.d * rates[1]
      + terms.geomA.dPrime * terms.vA * terms.vA;
    const angularAccelerationB = terms.geomB.d * rates[3]
      + terms.geomB.dPrime * terms.vB * terms.vB;
    const normalA = terms.translatingMassA * (
      g0 / terms.geomA.h
      + terms.geomA.lambda * terms.geomA.kappa * terms.geomA.h2 * terms.vA * terms.vA
    );
    const normalB = params.mB * (
      g0 / terms.geomB.h
      + terms.geomB.lambda * terms.geomB.kappa * terms.geomB.h2 * terms.vB * terms.vB
    );
    const frictionA = (terms.outerInertia * angularAccelerationA - terms.torqueA)
      / params.rAOuter;
    const frictionB = (terms.diskInertia * angularAccelerationB - params.ratio * terms.torqueB)
      / params.rB;
    const utilizationA = Math.abs(frictionA) / Math.max(1e-8, params.mu * normalA);
    const utilizationB = Math.abs(frictionB) / Math.max(1e-8, params.mu * normalB);
    return {
      ...terms,
      accelerationA: rates[1],
      accelerationB: rates[3],
      rotorAcceleration: rates[5],
      normalA,
      normalB,
      frictionA,
      frictionB,
      utilizationA,
      utilizationB,
      mechanical: mechanicalEnergy(state),
      balance: mechanicalEnergy(state) + state[6]
    };
  }

  function advanceOneStep() {
    state = rk4Step(state, fixedDt);
    resolveBodyCollision();
    simulationTime += fixedDt;
    if (simulationTime &gt;= nextHistoryTime) {
      const currentMechanical = mechanicalEnergy(state);
      history.push({
        t: simulationTime,
        mechanical: currentMechanical,
        balance: currentMechanical + state[6]
      });
      nextHistoryTime += 1 / 30;
      const oldest = simulationTime - maxHistorySeconds;
      while (history.length &gt; 2 &amp;&amp; history[0].t &lt; oldest) history.shift();
    }
  }

  function syncControls() {
    controls.curvature.value = params.a.toFixed(2);
    controls.stiffness.value = params.k.toFixed(2);
    controls.damping.value = params.c.toFixed(2);
    controls.friction.value = params.mu.toFixed(2);
    controlValues.curvature.textContent = `${params.a.toFixed(2)} m⁻¹`;
    controlValues.stiffness.textContent = `${params.k.toFixed(2)} N·m/rad`;
    controlValues.damping.textContent = `${params.c.toFixed(2)} N·m·s/rad`;
    controlValues.friction.textContent = `μ = ${params.mu.toFixed(2)}`;
  }

  function updatePlayButton() {
    playButton.textContent = playing ? &#x27;Pause&#x27; : &#x27;Resume&#x27;;
    playButton.setAttribute(&#x27;aria-pressed&#x27;, playing ? &#x27;true&#x27; : &#x27;false&#x27;);
  }

  function resetExperiment() {
    state = new Float64Array([
      params.xA,
      params.vA,
      params.xB,
      params.vB,
      params.psi,
      params.omega,
      0
    ]);
    anchors = {
      xA: params.xA,
      xB: params.xB,
      deltaA: params.psi,
      deltaB: params.psi
    };
    simulationTime = 0;
    accumulator = 0;
    nextHistoryTime = 0;
    history = [];
    collisionFlash = 0;
    energyReference = mechanicalEnergy(state);
    const initialMechanical = mechanicalEnergy(state);
    history.push({ t: 0, mechanical: initialMechanical, balance: initialMechanical });
    syncControls();
    updateOutputs(true);
  }

  function applyScenario(name) {
    params = { ...scenarioData[name] };
    resetExperiment();
  }

  function rebaselineEnergy() {
    state[6] = 0;
    energyReference = mechanicalEnergy(state);
    history = [{ t: simulationTime, mechanical: energyReference, balance: energyReference }];
    nextHistoryTime = simulationTime + 1 / 30;
  }

  function formatPercent(value, digits = 0) {
    if (!Number.isFinite(value)) return &#x27;—&#x27;;
    return `${(value * 100).toFixed(digits)}%`;
  }

  function updateOutputs(force = false) {
    if (!force &amp;&amp; simulationTime - lastUiUpdate &lt; 1 / 20) return;
    lastUiUpdate = simulationTime;
    const d = diagnostics();
    const drift = (d.balance - energyReference) / Math.max(1, Math.abs(energyReference));
    const peakTorque = Math.max(Math.abs(d.torqueA), Math.abs(d.torqueB));
    const peakTraction = Math.max(d.utilizationA, d.utilizationB);
    const contactLost = d.normalA &lt;= 0 || d.normalB &lt;= 0;
    const infeasible = contactLost || peakTraction &gt; 1;
    let status = &#x27;IDEAL ROLLING&#x27;;
    if (contactLost) status = &#x27;LIFT-OFF PREDICTED&#x27;;
    else if (peakTraction &gt; 1) status = &#x27;NO-SLIP INFEASIBLE&#x27;;
    else if (collisionFlash &gt; 0.35) status = &#x27;BODY IMPACT&#x27;;
    contactOutput.textContent = status;
    stage.classList.toggle(&#x27;is-infeasible&#x27;, infeasible);
    energyOutput.textContent = `${Math.abs(drift * 100).toFixed(3)}%`;
    energyDetail.textContent = `E + losses = ${d.balance.toFixed(2)} J`;
    torqueOutput.textContent = `${peakTorque.toFixed(2)} N·m`;
    torqueDetail.textContent = `bearing ${d.torqueA.toFixed(2)} · drive ${d.torqueB.toFixed(2)}`;
    tractionOutput.textContent = formatPercent(peakTraction);
    tractionDetail.textContent = `A ${formatPercent(d.utilizationA)} · B ${formatPercent(d.utilizationB)}`;
    clockOutput.textContent = `t = ${simulationTime.toFixed(2)} s`;
    canvas.setAttribute(
      &#x27;aria-label&#x27;,
      `WebGL simulation at ${simulationTime.toFixed(1)} seconds. ${status.toLowerCase()}. `
      + `Annulus position ${state[0].toFixed(2)} meters, disk position ${state[2].toFixed(2)} meters.`
    );
    if (force || status !== liveOutput.dataset.status) {
      liveOutput.textContent = `${status}. Traction utilization ${formatPercent(peakTraction)}.`;
      liveOutput.dataset.status = status;
    }
  }

  function colorFromVariable(variableName) {
    const probe = document.createElement(&#x27;span&#x27;);
    probe.style.position = &#x27;absolute&#x27;;
    probe.style.pointerEvents = &#x27;none&#x27;;
    probe.style.opacity = &#x27;0&#x27;;
    probe.style.color = `var(${variableName})`;
    root.appendChild(probe);
    const resolved = getComputedStyle(probe).color;
    probe.remove();
    const sampleCanvas = document.createElement(&#x27;canvas&#x27;);
    sampleCanvas.width = 1;
    sampleCanvas.height = 1;
    const sampleContext = sampleCanvas.getContext(&#x27;2d&#x27;, { willReadFrequently: true });
    sampleContext.clearRect(0, 0, 1, 1);
    sampleContext.fillStyle = resolved;
    sampleContext.fillRect(0, 0, 1, 1);
    const data = sampleContext.getImageData(0, 0, 1, 1).data;
    return [data[0] / 255, data[1] / 255, data[2] / 255, data[3] / 255];
  }

  function withAlpha(color, alpha) {
    return [color[0], color[1], color[2], alpha];
  }

  function refreshPalette() {
    palette = {
      background: colorFromVariable(&#x27;--background&#x27;),
      foreground: colorFromVariable(&#x27;--foreground&#x27;),
      muted: colorFromVariable(&#x27;--muted&#x27;),
      mutedForeground: colorFromVariable(&#x27;--muted-foreground&#x27;),
      border: colorFromVariable(&#x27;--border&#x27;),
      destructive: colorFromVariable(&#x27;--destructive&#x27;),
      annulus: colorFromVariable(&#x27;--viz-series-1&#x27;),
      rotor: colorFromVariable(&#x27;--viz-series-2&#x27;),
      disk: colorFromVariable(&#x27;--viz-series-3&#x27;),
      track: colorFromVariable(&#x27;--viz-series-4&#x27;),
      energy: colorFromVariable(&#x27;--viz-series-5&#x27;),
      balance: colorFromVariable(&#x27;--viz-series-6&#x27;)
    };
  }

  refreshPalette();

  const themeObserver = new MutationObserver(() =&gt; refreshPalette());
  themeObserver.observe(document.documentElement, {
    attributes: true,
    attributeFilter: [&#x27;class&#x27;, &#x27;style&#x27;, &#x27;data-theme&#x27;]
  });

  let trianglePositions = [];
  let triangleColors = [];

  function pushVertexPx(x, y, color) {
    trianglePositions.push(
      2 * x / worldView.width - 1,
      1 - 2 * y / worldView.height
    );
    triangleColors.push(color[0], color[1], color[2], color[3]);
  }

  function addTrianglePx(a, b, c, color) {
    pushVertexPx(a.x, a.y, color);
    pushVertexPx(b.x, b.y, color);
    pushVertexPx(c.x, c.y, color);
  }

  function addQuadPx(a, b, c, d, color) {
    addTrianglePx(a, b, c, color);
    addTrianglePx(a, c, d, color);
  }

  function addLinePx(a, b, width, color) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const length = Math.hypot(dx, dy);
    if (length &lt; 1e-5) return;
    const nx = -dy / length * width * 0.5;
    const ny = dx / length * width * 0.5;
    addQuadPx(
      { x: a.x + nx, y: a.y + ny },
      { x: b.x + nx, y: b.y + ny },
      { x: b.x - nx, y: b.y - ny },
      { x: a.x - nx, y: a.y - ny },
      color
    );
  }

  function addPolylinePx(points, width, color) {
    for (let i = 1; i &lt; points.length; i += 1) {
      addLinePx(points[i - 1], points[i], width, color);
    }
  }

  function addCirclePx(center, radius, color, segments = 48) {
    for (let i = 0; i &lt; segments; i += 1) {
      const a0 = i / segments * Math.PI * 2;
      const a1 = (i + 1) / segments * Math.PI * 2;
      addTrianglePx(
        center,
        { x: center.x + Math.cos(a0) * radius, y: center.y + Math.sin(a0) * radius },
        { x: center.x + Math.cos(a1) * radius, y: center.y + Math.sin(a1) * radius },
        color
      );
    }
  }

  function addRingPx(center, innerRadius, outerRadius, color, segments = 64) {
    for (let i = 0; i &lt; segments; i += 1) {
      const a0 = i / segments * Math.PI * 2;
      const a1 = (i + 1) / segments * Math.PI * 2;
      const c0 = Math.cos(a0);
      const s0 = Math.sin(a0);
      const c1 = Math.cos(a1);
      const s1 = Math.sin(a1);
      addQuadPx(
        { x: center.x + c0 * innerRadius, y: center.y + s0 * innerRadius },
        { x: center.x + c0 * outerRadius, y: center.y + s0 * outerRadius },
        { x: center.x + c1 * outerRadius, y: center.y + s1 * outerRadius },
        { x: center.x + c1 * innerRadius, y: center.y + s1 * innerRadius },
        color
      );
    }
  }

  function addArrowPx(start, end, width, color) {
    addLinePx(start, end, width, color);
    const dx = end.x - start.x;
    const dy = end.y - start.y;
    const length = Math.hypot(dx, dy);
    if (length &lt; 4) return;
    const ux = dx / length;
    const uy = dy / length;
    const px = -uy;
    const py = ux;
    const head = Math.min(10, Math.max(6, width * 3.2));
    addTrianglePx(
      end,
      { x: end.x - ux * head + px * head * 0.45, y: end.y - uy * head + py * head * 0.45 },
      { x: end.x - ux * head - px * head * 0.45, y: end.y - uy * head - py * head * 0.45 },
      color
    );
  }

  function worldToScreen(x, y) {
    return {
      x: worldView.width * 0.5 + x * worldView.scale,
      y: worldView.baseline - y * worldView.scale
    };
  }

  function screenToWorld(x, y) {
    return {
      x: (x - worldView.width * 0.5) / worldView.scale,
      y: (worldView.baseline - y) / worldView.scale
    };
  }

  function addWorldLine(a, b, width, color) {
    addLinePx(worldToScreen(a.x, a.y), worldToScreen(b.x, b.y), width, color);
  }

  function addWorldArrow(start, vector, width, color) {
    addArrowPx(
      worldToScreen(start.x, start.y),
      worldToScreen(start.x + vector.x, start.y + vector.y),
      width,
      color
    );
  }

  function setOverlayPosition(element, point, offsetX, offsetY, center = true) {
    const x = point.x + offsetX;
    const y = point.y + offsetY;
    element.style.transform = center
      ? `translate(${x}px, ${y}px) translate(-50%, -50%)`
      : `translate(${x}px, ${y}px)`;
  }

  function drawGrid() {
    const topWorld = screenToWorld(0, 0).y;
    const bottomWorld = screenToWorld(0, worldView.height).y;
    const leftWorld = screenToWorld(0, 0).x;
    const rightWorld = screenToWorld(worldView.width, 0).x;
    const step = 0.5;
    const gridColor = withAlpha(palette.border, 0.28);
    const axisColor = withAlpha(palette.mutedForeground, 0.42);
    for (let x = Math.ceil(leftWorld / step) * step; x &lt;= rightWorld; x += step) {
      addWorldLine(
        { x, y: bottomWorld },
        { x, y: topWorld },
        Math.abs(x) &lt; 1e-6 ? 1.25 : 0.65,
        Math.abs(x) &lt; 1e-6 ? axisColor : gridColor
      );
    }
    for (let y = Math.ceil(bottomWorld / step) * step; y &lt;= topWorld; y += step) {
      addWorldLine(
        { x: leftWorld, y },
        { x: rightWorld, y },
        Math.abs(y) &lt; 1e-6 ? 1.25 : 0.65,
        Math.abs(y) &lt; 1e-6 ? axisColor : gridColor
      );
    }
  }

  function drawTrack() {
    const leftWorld = screenToWorld(-10, 0).x;
    const rightWorld = screenToWorld(worldView.width + 10, 0).x;
    const points = [];
    const samples = 130;
    for (let i = 0; i &lt;= samples; i += 1) {
      const x = leftWorld + (rightWorld - leftWorld) * i / samples;
      points.push(worldToScreen(x, params.a * x * x));
    }
    const ground = withAlpha(palette.muted, 0.24);
    for (let i = 1; i &lt; points.length; i += 1) {
      const p0 = points[i - 1];
      const p1 = points[i];
      addQuadPx(
        p0,
        p1,
        { x: p1.x, y: worldView.height + 1 },
        { x: p0.x, y: worldView.height + 1 },
        ground
      );
    }
    addPolylinePx(points, 3.2, withAlpha(palette.track, 0.95));
  }

  function drawBelt(terms) {
    const centerA = worldToScreen(terms.geomA.centerX, terms.geomA.centerY);
    const centerB = worldToScreen(terms.geomB.centerX, terms.geomB.centerY);
    const dx = centerB.x - centerA.x;
    const dy = centerB.y - centerA.y;
    const distance = Math.max(1, Math.hypot(dx, dy));
    const ux = dx / distance;
    const uy = dy / distance;
    const px = -uy;
    const py = ux;
    const rotorRadius = params.rRotor * worldView.scale;
    const diskRadius = params.rB * worldView.scale;
    const beltColor = withAlpha(
      Math.max(terms.utilizationA || 0, terms.utilizationB || 0) &gt; 1
        ? palette.destructive
        : palette.foreground,
      0.48
    );
    const topA = { x: centerA.x + px * rotorRadius, y: centerA.y + py * rotorRadius };
    const topB = { x: centerB.x + px * diskRadius, y: centerB.y + py * diskRadius };
    const bottomA = { x: centerA.x - px * rotorRadius, y: centerA.y - py * rotorRadius };
    const bottomB = { x: centerB.x - px * diskRadius, y: centerB.y - py * diskRadius };
    addLinePx(topA, topB, 1.5, beltColor);
    addLinePx(bottomA, bottomB, 1.5, beltColor);
    const markerPhase = ((terms.psi * params.rRotor * worldView.scale) % 34 + 34) % 34;
    for (let distanceAlong = markerPhase; distanceAlong &lt; distance; distanceAlong += 34) {
      const t = distanceAlong / distance;
      const x = topA.x + (topB.x - topA.x) * t;
      const y = topA.y + (topB.y - topA.y) * t;
      addLinePx(
        { x: x - px * 3, y: y - py * 3 },
        { x: x + px * 3, y: y + py * 3 },
        1.1,
        beltColor
      );
    }
    setOverlayPosition(
      driveLabel,
      { x: (centerA.x + centerB.x) * 0.5, y: (centerA.y + centerB.y) * 0.5 },
      0,
      -13
    );
  }

  function drawWheel(centerWorld, outerRadius, angle, fillColor, solid = true) {
    const center = worldToScreen(centerWorld.x, centerWorld.y);
    const outerPx = outerRadius * worldView.scale;
    if (solid) addCirclePx(center, outerPx, withAlpha(fillColor, 0.70), 58);
    addRingPx(center, Math.max(0, outerPx - 2.2), outerPx, withAlpha(fillColor, 0.98), 58);
    const spokeColor = withAlpha(palette.foreground, 0.72);
    for (let offset = 0; offset &lt; Math.PI * 2; offset += Math.PI / 2) {
      const a = angle + offset;
      addLinePx(
        center,
        { x: center.x + Math.cos(a) * outerPx * 0.82, y: center.y - Math.sin(a) * outerPx * 0.82 },
        1.5,
        spokeColor
      );
    }
    addCirclePx(center, Math.max(2.2, outerPx * 0.08), withAlpha(palette.foreground, 0.85), 18);
  }

  function drawAnnulus(terms) {
    const center = worldToScreen(terms.geomA.centerX, terms.geomA.centerY);
    const outerPx = params.rAOuter * worldView.scale;
    const innerPx = params.rAInner * worldView.scale;
    addRingPx(center, innerPx, outerPx, withAlpha(palette.annulus, 0.78), 72);
    addRingPx(center, Math.max(0, outerPx - 2.2), outerPx, withAlpha(palette.annulus, 0.98), 72);
    addRingPx(center, innerPx, innerPx + 1.6, withAlpha(palette.foreground, 0.58), 72);
    const spokeAngle = terms.thetaA;
    const spokeColor = withAlpha(palette.foreground, 0.80);
    for (const offset of [0, Math.PI]) {
      const a = spokeAngle + offset;
      addLinePx(
        {
          x: center.x + Math.cos(a) * innerPx,
          y: center.y - Math.sin(a) * innerPx
        },
        {
          x: center.x + Math.cos(a) * outerPx,
          y: center.y - Math.sin(a) * outerPx
        },
        2,
        spokeColor
      );
    }
    drawWheel(
      { x: terms.geomA.centerX, y: terms.geomA.centerY },
      params.rRotor,
      terms.psi,
      palette.rotor,
      true
    );
  }

  function drawContactAndVectors(geometry, velocity, normal, friction, mass, radius, bodyColor) {
    const contact = { x: geometry.contactX, y: geometry.contactY };
    const contactScreen = worldToScreen(contact.x, contact.y);
    addCirclePx(contactScreen, 4.1, withAlpha(palette.foreground, 0.90), 18);
    addWorldLine(
      {
        x: contact.x - geometry.tx * radius * 0.18,
        y: contact.y - geometry.ty * radius * 0.18
      },
      {
        x: contact.x + geometry.tx * radius * 0.18,
        y: contact.y + geometry.ty * radius * 0.18
      },
      2.5,
      withAlpha(palette.foreground, 0.66)
    );
    const normalLength = Math.min(0.72, Math.max(0, normal) / (mass * g0) * 0.29);
    addWorldArrow(
      contact,
      { x: geometry.nx * normalLength, y: geometry.ny * normalLength },
      1.7,
      withAlpha(palette.foreground, 0.72)
    );
    const frictionLength = Math.min(0.55, Math.abs(friction) / (mass * g0) * 0.65);
    if (frictionLength &gt; 0.015) {
      const sign = Math.sign(friction);
      addWorldArrow(
        contact,
        { x: geometry.tx * frictionLength * sign, y: geometry.ty * frictionLength * sign },
        1.7,
        withAlpha(palette.mutedForeground, 0.88)
      );
    }
    const centerVelocityVector = centerVelocity(geometry, velocity);
    const speed = Math.hypot(centerVelocityVector.x, centerVelocityVector.y);
    if (speed &gt; 0.025) {
      const velocityScale = Math.min(0.9 / speed, 0.18);
      addWorldArrow(
        { x: geometry.centerX, y: geometry.centerY },
        {
          x: centerVelocityVector.x * velocityScale,
          y: centerVelocityVector.y * velocityScale
        },
        2,
        withAlpha(bodyColor, 0.94)
      );
    }
  }

  function drawEnergyHistory() {
    if (worldView.width &lt; 520 || history.length &lt; 2) {
      energyKey.hidden = true;
      return;
    }
    energyKey.hidden = false;
    const plotWidth = Math.min(250, worldView.width * 0.36);
    const plotHeight = 62;
    const x0 = worldView.width - plotWidth - 12;
    const y0 = 32;
    const recent = history;
    let minValue = Infinity;
    let maxValue = -Infinity;
    for (const point of recent) {
      minValue = Math.min(minValue, point.mechanical, point.balance);
      maxValue = Math.max(maxValue, point.mechanical, point.balance);
    }
    const span = Math.max(0.15, maxValue - minValue);
    minValue -= span * 0.12;
    maxValue += span * 0.12;
    const firstTime = recent[0].t;
    const lastTime = Math.max(firstTime + 0.1, recent[recent.length - 1].t);
    const mechanicalPoints = [];
    const balancePoints = [];
    for (const point of recent) {
      const x = x0 + (point.t - firstTime) / (lastTime - firstTime) * plotWidth;
      mechanicalPoints.push({
        x,
        y: y0 + plotHeight - (point.mechanical - minValue) / (maxValue - minValue) * plotHeight
      });
      balancePoints.push({
        x,
        y: y0 + plotHeight - (point.balance - minValue) / (maxValue - minValue) * plotHeight
      });
    }
    addLinePx(
      { x: x0, y: y0 + plotHeight },
      { x: x0 + plotWidth, y: y0 + plotHeight },
      0.8,
      withAlpha(palette.border, 0.45)
    );
    addPolylinePx(mechanicalPoints, 1.8, withAlpha(palette.energy, 0.94));
    addPolylinePx(balancePoints, 1.8, withAlpha(palette.balance, 0.94));
  }

  function uploadAndDraw() {
    if (trianglePositions.length === 0) return;
    gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(trianglePositions), gl.DYNAMIC_DRAW);
    gl.vertexAttribPointer(positionLocation, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(triangleColors), gl.DYNAMIC_DRAW);
    gl.vertexAttribPointer(colorLocation, 4, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, trianglePositions.length / 2);
  }

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const displayWidth = Math.max(1, Math.round(rect.width * dpr));
    const displayHeight = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
      canvas.width = displayWidth;
      canvas.height = displayHeight;
    }
    gl.viewport(0, 0, displayWidth, displayHeight);
    worldView.width = rect.width;
    worldView.height = rect.height;
    const visibleWorldWidth = rect.width &lt; 480 ? 4.5 : 6.7;
    worldView.scale = Math.min(rect.width / visibleWorldWidth, rect.height / 3.55);
    worldView.baseline = rect.height * 0.79;
  }

  function render() {
    resizeCanvas();
    if (!palette) refreshPalette();
    trianglePositions = [];
    triangleColors = [];
    gl.clearColor(palette.background[0], palette.background[1], palette.background[2], 0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    const d = diagnostics();
    drawGrid();
    drawTrack();
    drawBelt(d);
    drawContactAndVectors(
      d.geomA,
      d.vA,
      d.normalA,
      d.frictionA,
      d.translatingMassA,
      params.rAOuter,
      palette.annulus
    );
    drawContactAndVectors(
      d.geomB,
      d.vB,
      d.normalB,
      d.frictionB,
      params.mB,
      params.rB,
      palette.disk
    );
    drawAnnulus(d);
    drawWheel(
      { x: d.geomB.centerX, y: d.geomB.centerY },
      params.rB,
      d.thetaB,
      palette.disk,
      true
    );
    if (collisionFlash &gt; 0) {
      const centerA = worldToScreen(d.geomA.centerX, d.geomA.centerY);
      const centerB = worldToScreen(d.geomB.centerX, d.geomB.centerY);
      const impactPoint = {
        x: (centerA.x + centerB.x) * 0.5,
        y: (centerA.y + centerB.y) * 0.5
      };
      addRingPx(
        impactPoint,
        8 + (1 - collisionFlash) * 14,
        10 + (1 - collisionFlash) * 14,
        withAlpha(palette.destructive, collisionFlash * 0.72),
        28
      );
    }
    drawEnergyHistory();
    uploadAndDraw();
    const pointA = worldToScreen(d.geomA.centerX, d.geomA.centerY);
    const pointB = worldToScreen(d.geomB.centerX, d.geomB.centerY);
    setOverlayPosition(labelA, pointA, 0, -params.rAOuter * worldView.scale - 14);
    setOverlayPosition(labelR, pointA, 0, 4);
    setOverlayPosition(labelB, pointB, 0, -params.rB * worldView.scale - 14);
  }

  function frame(now) {
    const elapsed = Math.min(0.05, Math.max(0, (now - lastFrameTime) / 1000));
    lastFrameTime = now;
    if (playing &amp;&amp; !dragTarget) {
      accumulator += elapsed;
      let steps = 0;
      while (accumulator &gt;= fixedDt &amp;&amp; steps &lt; 18) {
        advanceOneStep();
        accumulator -= fixedDt;
        steps += 1;
      }
      if (steps === 18) accumulator = 0;
    }
    collisionFlash = Math.max(0, collisionFlash - elapsed * 2.8);
    updateOutputs();
    render();
    requestAnimationFrame(frame);
  }

  playButton.addEventListener(&#x27;click&#x27;, () =&gt; {
    playing = !playing;
    accumulator = 0;
    updatePlayButton();
  });

  releaseButton.addEventListener(&#x27;click&#x27;, () =&gt; {
    resetExperiment();
  });

  stepButton.addEventListener(&#x27;click&#x27;, () =&gt; {
    playing = false;
    updatePlayButton();
    advanceOneStep();
    updateOutputs(true);
  });

  presetSelect.addEventListener(&#x27;change&#x27;, () =&gt; {
    applyScenario(presetSelect.value);
  });

  controls.curvature.addEventListener(&#x27;input&#x27;, () =&gt; {
    params.a = Number(controls.curvature.value);
    controlValues.curvature.textContent = `${params.a.toFixed(2)} m⁻¹`;
    rebaselineEnergy();
  });

  controls.stiffness.addEventListener(&#x27;input&#x27;, () =&gt; {
    params.k = Number(controls.stiffness.value);
    controlValues.stiffness.textContent = `${params.k.toFixed(2)} N·m/rad`;
    rebaselineEnergy();
  });

  controls.damping.addEventListener(&#x27;input&#x27;, () =&gt; {
    params.c = Number(controls.damping.value);
    controlValues.damping.textContent = `${params.c.toFixed(2)} N·m·s/rad`;
    rebaselineEnergy();
  });

  controls.friction.addEventListener(&#x27;input&#x27;, () =&gt; {
    params.mu = Number(controls.friction.value);
    controlValues.friction.textContent = `μ = ${params.mu.toFixed(2)}`;
    updateOutputs(true);
  });

  function pointerPosition(event) {
    const rect = canvas.getBoundingClientRect();
    return { x: event.clientX - rect.left, y: event.clientY - rect.top };
  }

  canvas.addEventListener(&#x27;pointerdown&#x27;, (event) =&gt; {
    const pointer = pointerPosition(event);
    const d = diagnostics();
    const centerA = worldToScreen(d.geomA.centerX, d.geomA.centerY);
    const centerB = worldToScreen(d.geomB.centerX, d.geomB.centerY);
    const distanceA = Math.hypot(pointer.x - centerA.x, pointer.y - centerA.y);
    const distanceB = Math.hypot(pointer.x - centerB.x, pointer.y - centerB.y);
    if (distanceA &lt;= params.rAOuter * worldView.scale + 12) dragTarget = &#x27;A&#x27;;
    else if (distanceB &lt;= params.rB * worldView.scale + 12) dragTarget = &#x27;B&#x27;;
    if (!dragTarget) return;
    playing = false;
    updatePlayButton();
    canvas.setPointerCapture(event.pointerId);
  });

  canvas.addEventListener(&#x27;pointermove&#x27;, (event) =&gt; {
    if (!dragTarget) return;
    const pointer = pointerPosition(event);
    const world = screenToWorld(pointer.x, pointer.y);
    const radius = dragTarget === &#x27;A&#x27; ? params.rAOuter : params.rB;
    let x = dragTarget === &#x27;A&#x27; ? state[0] : state[2];
    for (let iteration = 0; iteration &lt; 5; iteration += 1) {
      const geometry = rollingGeometry(x, radius, 1);
      x -= (geometry.centerX - world.x) / Math.max(0.18, geometry.lambda);
    }
    x = Math.max(-2.8, Math.min(2.8, x));
    if (dragTarget === &#x27;A&#x27;) {
      state[0] = x;
      state[1] = 0;
    } else {
      state[2] = x;
      state[3] = 0;
    }
    resolveBodyCollision();
    rebaselineEnergy();
    updateOutputs(true);
  });

  function endDrag(event) {
    if (!dragTarget) return;
    dragTarget = null;
    if (canvas.hasPointerCapture(event.pointerId)) canvas.releasePointerCapture(event.pointerId);
  }

  canvas.addEventListener(&#x27;pointerup&#x27;, endDrag);
  canvas.addEventListener(&#x27;pointercancel&#x27;, endDrag);

  const resizeObserver = new ResizeObserver(() =&gt; render());
  resizeObserver.observe(stage);

  resetExperiment();
  updatePlayButton();
  requestAnimationFrame(frame);
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
