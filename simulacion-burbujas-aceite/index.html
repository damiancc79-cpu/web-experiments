      &lt;input class=&quot;form-range&quot; id=&quot;chns-viscosity&quot; type=&quot;range&quot; min=&quot;0.001&quot; max=&quot;0.012&quot; value=&quot;0.004&quot; step=&quot;0.001&quot;&gt;

    &lt;summary class=&quot;text-small&quot;&gt;Numerics &amp;amp; phase kinetics&lt;/summary&gt;

      &lt;label class=&quot;form-label&quot; for=&quot;chns-mobility&quot;&gt;
        &lt;span class=&quot;chns-label-line&quot;&gt;&lt;span&gt;Mobility M&lt;/span&gt;&lt;output id=&quot;chns-mobility-out&quot;&gt;0.0030&lt;/output&gt;&lt;/span&gt;
        &lt;input class=&quot;form-range&quot; id=&quot;chns-mobility&quot; type=&quot;range&quot; min=&quot;0.0008&quot; max=&quot;0.0070&quot; value=&quot;0.0030&quot; step=&quot;0.0002&quot;&gt;

        &lt;input class=&quot;form-range&quot; id=&quot;chns-reaction&quot; type=&quot;range&quot; min=&quot;0.00&quot; max=&quot;0.40&quot; value=&quot;0.06&quot; step=&quot;0.02&quot;&gt;

  &lt;span class=&quot;sr-only&quot; id=&quot;chns-description&quot;&gt;The scalar field is positive in oil and negative in water. Twenty initially separated, lognormally sized droplets move in a divergence-free flow on a periodic unit square, so structures crossing one edge reappear on the opposite edge.&lt;/span&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;chns-oil-lab&#x27;);
  if (!root) return;

  const N = 64;
  const SIZE = N * N;
  const DX = 1 / N;
  const INV_2DX = 1 / (2 * DX);
  const INV_DX2 = 1 / (DX * DX);
  const TAU = Math.PI * 2;
  const BASE_DT = 0.0012;
  const DROPLET_COUNT = 20;

  const canvas = root.querySelector(&#x27;#chns-canvas&#x27;);
  const ctx = canvas.getContext(&#x27;2d&#x27;, { alpha: false });
  const fieldCanvas = document.createElement(&#x27;canvas&#x27;);
  fieldCanvas.width = N;
  fieldCanvas.height = N;
  const fieldCtx = fieldCanvas.getContext(&#x27;2d&#x27;, { alpha: false });
  const fieldImage = fieldCtx.createImageData(N, N);

  const refs = {
    run: root.querySelector(&#x27;#chns-run&#x27;),
    step: root.querySelector(&#x27;#chns-step&#x27;),
    vectors: root.querySelector(&#x27;#chns-vectors&#x27;),
    error: root.querySelector(&#x27;#chns-error&#x27;),
    time: root.querySelector(&#x27;#chns-time&#x27;),
    area: root.querySelector(&#x27;#chns-area&#x27;),
    regions: root.querySelector(&#x27;#chns-regions&#x27;),
    speed: root.querySelector(&#x27;#chns-speed&#x27;)
  };

  const params = {
    meanRadius: 0.046,
    radiusSD: 0.011,
    epsilon: 0.018,
    kick: 0.45,
    tension: 0.45,
    viscosity: 0.004,
    mobility: 0.003,
    reaction: 0.06,
    rate: 2
  };

  const phi = new Float64Array(SIZE);
  const u = new Float64Array(SIZE);
  const v = new Float64Array(SIZE);
  const mu = new Float64Array(SIZE);
  const nonlinear = new Float64Array(SIZE);
  const advPhi = new Float64Array(SIZE);
  const uStar = new Float64Array(SIZE);
  const vStar = new Float64Array(SIZE);

  const rPhi = new Float64Array(SIZE);
  const iPhi = new Float64Array(SIZE);
  const rNonlinear = new Float64Array(SIZE);
  const iNonlinear = new Float64Array(SIZE);
  const rAdv = new Float64Array(SIZE);
  const iAdv = new Float64Array(SIZE);
  const rU = new Float64Array(SIZE);
  const iU = new Float64Array(SIZE);
  const rV = new Float64Array(SIZE);
  const iV = new Float64Array(SIZE);

  const kx = new Float64Array(SIZE);
  const ky = new Float64Array(SIZE);
  const k2 = new Float64Array(SIZE);
  const laplacianSymbol = new Float64Array(SIZE);
  const dealiased = new Uint8Array(SIZE);
  const left = new Int32Array(SIZE);
  const right = new Int32Array(SIZE);
  const up = new Int32Array(SIZE);
  const down = new Int32Array(SIZE);
  const bitReverse = new Int32Array(N);
  const tempRe = new Float64Array(N);
  const tempIm = new Float64Array(N);
  const visited = new Uint8Array(SIZE);
  const queue = new Int32Array(SIZE);

  for (let i = 0; i &lt; N; i++) {
    let x = i;
    let reversed = 0;
    for (let b = 0; b &lt; 6; b++) {
      reversed = (reversed &lt;&lt; 1) | (x &amp; 1);
      x &gt;&gt;= 1;
    }
    bitReverse[i] = reversed;
  }

  for (let y = 0; y &lt; N; y++) {
    const modeY = y &lt;= N / 2 ? y : y - N;
    for (let x = 0; x &lt; N; x++) {
      const modeX = x &lt;= N / 2 ? x : x - N;
      const id = y * N + x;
      kx[id] = Math.sin(TAU * modeX / N) / DX;
      ky[id] = Math.sin(TAU * modeY / N) / DX;
      k2[id] = kx[id] * kx[id] + ky[id] * ky[id];
      laplacianSymbol[id] = 4 * INV_DX2 * (
        Math.sin(Math.PI * modeX / N) ** 2 +
        Math.sin(Math.PI * modeY / N) ** 2
      );
      dealiased[id] = Math.abs(modeX) &lt;= N / 3 &amp;&amp; Math.abs(modeY) &lt;= N / 3 ? 1 : 0;
      left[id] = y * N + (x + N - 1) % N;
      right[id] = y * N + (x + 1) % N;
      up[id] = ((y + N - 1) % N) * N + x;
      down[id] = ((y + 1) % N) * N + x;
    }
  }

  function fft1D(real, imag, inverse) {
    for (let i = 0; i &lt; N; i++) {
      const j = bitReverse[i];
      if (j &gt; i) {
        let t = real[i]; real[i] = real[j]; real[j] = t;
        t = imag[i]; imag[i] = imag[j]; imag[j] = t;
      }
    }

    for (let length = 2; length &lt;= N; length &lt;&lt;= 1) {
      const angle = (inverse ? TAU : -TAU) / length;
      const stepCos = Math.cos(angle);
      const stepSin = Math.sin(angle);
      const half = length &gt;&gt; 1;
      for (let start = 0; start &lt; N; start += length) {
        let wr = 1;
        let wi = 0;
        for (let j = 0; j &lt; half; j++) {
          const even = start + j;
          const odd = even + half;
          const oddR = real[odd] * wr - imag[odd] * wi;
          const oddI = real[odd] * wi + imag[odd] * wr;
          const evenR = real[even];
          const evenI = imag[even];
          real[even] = evenR + oddR;
          imag[even] = evenI + oddI;
          real[odd] = evenR - oddR;
          imag[odd] = evenI - oddI;
          const nextWr = wr * stepCos - wi * stepSin;
          wi = wr * stepSin + wi * stepCos;
          wr = nextWr;
        }
      }
    }

    if (inverse) {
      for (let i = 0; i &lt; N; i++) {
        real[i] /= N;
        imag[i] /= N;
      }
    }
  }

  function fft2(real, imag, inverse) {
    for (let y = 0; y &lt; N; y++) {
      const offset = y * N;
      for (let x = 0; x &lt; N; x++) {
        tempRe[x] = real[offset + x];
        tempIm[x] = imag[offset + x];
      }
      fft1D(tempRe, tempIm, inverse);
      for (let x = 0; x &lt; N; x++) {
        real[offset + x] = tempRe[x];
        imag[offset + x] = tempIm[x];
      }
    }

    for (let x = 0; x &lt; N; x++) {
      for (let y = 0; y &lt; N; y++) {
        const id = y * N + x;
        tempRe[y] = real[id];
        tempIm[y] = imag[id];
      }
      fft1D(tempRe, tempIm, inverse);
      for (let y = 0; y &lt; N; y++) {
        const id = y * N + x;
        real[id] = tempRe[y];
        imag[id] = tempIm[y];
      }
    }
  }

  function forwardReal(source, real, imag) {
    real.set(source);
    imag.fill(0);
    fft2(real, imag, false);
  }

  function inverseReal(real, imag, target) {
    fft2(real, imag, true);
    for (let i = 0; i &lt; SIZE; i++) target[i] = real[i];
  }

  function mulberry32(seed) {
    return function random() {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ t &gt;&gt;&gt; 15, t | 1);
      t ^= t + Math.imul(t ^ t &gt;&gt;&gt; 7, t | 61);
      return ((t ^ t &gt;&gt;&gt; 14) &gt;&gt;&gt; 0) / 4294967296;
    };
  }

  function gaussian(random) {
    const a = Math.max(random(), 1e-12);
    const b = random();
    return Math.sqrt(-2 * Math.log(a)) * Math.cos(TAU * b);
  }

  let simTime = 0;
  let stepCount = 0;
  let initialOil = 0;
  let targetMeanPhi = 0;
  let lastMaxSpeed = params.kick;
  let lastRegions = DROPLET_COUNT;
  let running = !window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;).matches;
  let lastStatusAt = 0;

  function initialize() {
    const random = mulberry32(0xC0FFEE);
    const logVariance = Math.log(1 + (params.radiusSD * params.radiusSD) / (params.meanRadius * params.meanRadius));
    const logSigma = Math.sqrt(logVariance);
    const logMean = Math.log(params.meanRadius) - 0.5 * logVariance;
    const radii = [];

    for (let i = 0; i &lt; DROPLET_COUNT; i++) {
      radii.push(Math.exp(logMean + logSigma * gaussian(random)));
    }
    const sampledMean = radii.reduce((sum, value) =&gt; sum + value, 0) / radii.length;
    for (let i = 0; i &lt; radii.length; i++) {
      radii[i] = Math.min(0.074, Math.max(0.027, radii[i] * params.meanRadius / sampledMean));
    }

    const droplets = [];
    const orderedRadii = radii.slice().sort((a, b) =&gt; b - a);
    const minimumGap = Math.max(0.5 * params.epsilon, 0.9 * DX);
    for (const radius of orderedRadii) {
      let accepted = null;
      let best = null;
      let bestClearance = -Infinity;
      for (let attempt = 0; attempt &lt; 2500; attempt++) {
        const candidate = { x: random(), y: random(), r: radius };
        let clearance = Infinity;
        for (const placed of droplets) {
          let ddx = Math.abs(candidate.x - placed.x);
          let ddy = Math.abs(candidate.y - placed.y);
          ddx = Math.min(ddx, 1 - ddx);
          ddy = Math.min(ddy, 1 - ddy);
          clearance = Math.min(clearance, Math.hypot(ddx, ddy) - candidate.r - placed.r);
        }
        if (clearance &gt; bestClearance) {
          bestClearance = clearance;
          best = candidate;
        }
        if (clearance &gt;= minimumGap) {
          accepted = candidate;
          break;
        }
      }
      droplets.push(accepted || best);
    }

    const interfaceScale = Math.sqrt(2) * params.epsilon;
    let phiSum = 0;
    for (let y = 0; y &lt; N; y++) {
      const py = (y + 0.5) / N;
      for (let x = 0; x &lt; N; x++) {
        const px = (x + 0.5) / N;
        let signedDistance = -Infinity;
        for (const droplet of droplets) {
          let ddx = Math.abs(px - droplet.x);
          let ddy = Math.abs(py - droplet.y);
          ddx = Math.min(ddx, 1 - ddx);
          ddy = Math.min(ddy, 1 - ddy);
          signedDistance = Math.max(signedDistance, droplet.r - Math.hypot(ddx, ddy));
        }
        const id = y * N + x;
        phi[id] = Math.tanh(signedDistance / interfaceScale);
        phiSum += phi[id];
      }
    }
    targetMeanPhi = phiSum / SIZE;

    u.fill(0);
    v.fill(0);
    const modes = [];
    for (let m = 0; m &lt; 8; m++) {
      let mx = Math.floor(random() * 7) - 3;
      let my = Math.floor(random() * 7) - 3;
      if (mx === 0 &amp;&amp; my === 0) mx = 1;
      const magnitude2 = mx * mx + my * my;
      modes.push({
        mx,
        my,
        phase: TAU * random(),
        amplitude: gaussian(random) / Math.pow(magnitude2, 1.25)
      });
    }

    const desiredKicks = new Array(droplets.length);
    const unpaired = droplets.map((_, index) =&gt; index);
    while (unpaired.length &gt; 1) {
      const first = unpaired.shift();
      let partnerPosition = 0;
      let partnerDx = 0;
      let partnerDy = 0;
      let nearest = Infinity;
      for (let p = 0; p &lt; unpaired.length; p++) {
        let ddx = droplets[unpaired[p]].x - droplets[first].x;
        let ddy = droplets[unpaired[p]].y - droplets[first].y;
        ddx -= Math.round(ddx);
        ddy -= Math.round(ddy);
        const distance = Math.hypot(ddx, ddy);
        if (distance &lt; nearest) {
          nearest = distance;
          partnerPosition = p;
          partnerDx = ddx;
          partnerDy = ddy;
        }
      }
      const second = unpaired.splice(partnerPosition, 1)[0];
      const inverseDistance = 1 / Math.max(nearest, 1e-12);
      const directionX = partnerDx * inverseDistance;
      const directionY = partnerDy * inverseDistance;
      desiredKicks[first] = { x: directionX, y: directionY };
      desiredKicks[second] = { x: -directionX, y: -directionY };
    }

    const kickWidth2 = 0.0144;
    const degrees = droplets.length * 2;
    const stride = degrees + 1;
    const augmented = new Float64Array(degrees * stride);
    for (let target = 0; target &lt; droplets.length; target++) {
      const rowX = 2 * target;
      const rowY = rowX + 1;
      for (let source = 0; source &lt; droplets.length; source++) {
        let ddx = droplets[target].x - droplets[source].x;
        let ddy = droplets[target].y - droplets[source].y;
        ddx -= Math.round(ddx);
        ddy -= Math.round(ddy);
        const weight = Math.exp(-0.5 * (ddx * ddx + ddy * ddy) / kickWidth2);
        const basisXX = (1 - ddy * ddy / kickWidth2) * weight;
        const basisXY = ddx * ddy / kickWidth2 * weight;
        const basisYY = (1 - ddx * ddx / kickWidth2) * weight;
        augmented[rowX * stride + 2 * source] = basisXX;
        augmented[rowX * stride + 2 * source + 1] = basisXY;
        augmented[rowY * stride + 2 * source] = basisXY;
        augmented[rowY * stride + 2 * source + 1] = basisYY;
      }
      augmented[rowX * stride + rowX] += 0.04;
      augmented[rowY * stride + rowY] += 0.04;
      augmented[rowX * stride + degrees] = desiredKicks[target].x;
      augmented[rowY * stride + degrees] = desiredKicks[target].y;
    }

    for (let column = 0; column &lt; degrees; column++) {
      let pivot = column;
      let pivotMagnitude = Math.abs(augmented[pivot * stride + column]);
      for (let row = column + 1; row &lt; degrees; row++) {
        const magnitude = Math.abs(augmented[row * stride + column]);
        if (magnitude &gt; pivotMagnitude) {
          pivot = row;
          pivotMagnitude = magnitude;
        }
      }
      if (pivot !== column) {
        for (let entry = column; entry &lt;= degrees; entry++) {
          const a = column * stride + entry;
          const b = pivot * stride + entry;
          const temporary = augmented[a];
          augmented[a] = augmented[b];
          augmented[b] = temporary;
        }
      }
      const pivotValue = augmented[column * stride + column];
      if (Math.abs(pivotValue) &lt; 1e-10) continue;
      for (let entry = column; entry &lt;= degrees; entry++) {
        augmented[column * stride + entry] /= pivotValue;
      }
      for (let row = 0; row &lt; degrees; row++) {
        if (row === column) continue;
        const factor = augmented[row * stride + column];
        if (Math.abs(factor) &lt; 1e-14) continue;
        for (let entry = column; entry &lt;= degrees; entry++) {
          augmented[row * stride + entry] -= factor * augmented[column * stride + entry];
        }
      }
    }
    const kickCoefficients = new Float64Array(degrees);
    for (let i = 0; i &lt; degrees; i++) kickCoefficients[i] = augmented[i * stride + degrees];

    for (let y = 0; y &lt; N; y++) {
      const py = (y + 0.5) / N;
      for (let x = 0; x &lt; N; x++) {
        const px = (x + 0.5) / N;
        const id = y * N + x;
        let ux = 0;
        let vy = 0;
        for (let source = 0; source &lt; droplets.length; source++) {
          let ddx = px - droplets[source].x;
          let ddy = py - droplets[source].y;
          ddx -= Math.round(ddx);
          ddy -= Math.round(ddy);
          const gaussianWeight = Math.exp(-0.5 * (ddx * ddx + ddy * ddy) / kickWidth2);
          const coefficientX = kickCoefficients[2 * source];
          const coefficientY = kickCoefficients[2 * source + 1];
          const streamLinear = coefficientX * ddy - coefficientY * ddx;
          ux += (coefficientX - streamLinear * ddy / kickWidth2) * gaussianWeight;
          vy += (coefficientY + streamLinear * ddx / kickWidth2) * gaussianWeight;
        }
        for (const mode of modes) {
          const c = Math.cos(TAU * (mode.mx * px + mode.my * py) + mode.phase);
          ux += 0.08 * mode.amplitude * TAU * mode.my * c;
          vy -= 0.08 * mode.amplitude * TAU * mode.mx * c;
        }
        u[id] = ux;
        v[id] = vy;
      }
    }

    let velocityEnergy = 0;
    for (let i = 0; i &lt; SIZE; i++) velocityEnergy += u[i] * u[i] + v[i] * v[i];
    const scale = params.kick / Math.max(Math.sqrt(velocityEnergy / SIZE), 1e-12);
    lastMaxSpeed = 0;
    for (let i = 0; i &lt; SIZE; i++) {
      u[i] *= scale;
      v[i] *= scale;
      lastMaxSpeed = Math.max(lastMaxSpeed, Math.hypot(u[i], v[i]));
    }

    simTime = 0;
    stepCount = 0;
    lastStatusAt = performance.now();
    initialOil = oilFraction();
    lastRegions = countRegions();
    refs.error.hidden = true;
    updateRunButton();
    updateStatus();
    render();
  }

  function buildSpatialTerms(dt) {
    const epsilon2 = params.epsilon * params.epsilon;
    for (let id = 0; id &lt; SIZE; id++) {
      const p = phi[id];
      const laplacian = (phi[left[id]] + phi[right[id]] + phi[up[id]] + phi[down[id]] - 4 * p) * INV_DX2;
      nonlinear[id] = p * p * p - p;
      mu[id] = nonlinear[id] - epsilon2 * laplacian;
    }

    for (let id = 0; id &lt; SIZE; id++) {
      const l = left[id];
      const r = right[id];
      const t = up[id];
      const b = down[id];
      const ux = u[id];
      const vy = v[id];
      const duDx = (u[r] - u[l]) * INV_2DX;
      const duDy = (u[b] - u[t]) * INV_2DX;
      const dvDx = (v[r] - v[l]) * INV_2DX;
      const dvDy = (v[b] - v[t]) * INV_2DX;
      const dMuDx = (mu[r] - mu[l]) * INV_2DX;
      const dMuDy = (mu[b] - mu[t]) * INV_2DX;
      const advU = ux * duDx + vy * duDy;
      const advV = ux * dvDx + vy * dvDy;
      const capillaryX = -params.tension * phi[id] * dMuDx;
      const capillaryY = -params.tension * phi[id] * dMuDy;
      uStar[id] = ux + dt * (-advU + capillaryX);
      vStar[id] = vy + dt * (-advV + capillaryY);
      advPhi[id] = (
        u[r] * phi[r] - u[l] * phi[l] +
        v[b] * phi[b] - v[t] * phi[t]
      ) * INV_2DX;
    }
  }

  function projectVelocity(dt) {
    forwardReal(uStar, rU, iU);
    forwardReal(vStar, rV, iV);

    for (let id = 0; id &lt; SIZE; id++) {
      if (!dealiased[id]) {
        rU[id] = 0; iU[id] = 0; rV[id] = 0; iV[id] = 0;
        continue;
      }
      if (k2[id] === 0) {
        rU[id] = 0; iU[id] = 0; rV[id] = 0; iV[id] = 0;
        continue;
      }
      const inverseK2 = 1 / k2[id];
      const dotReal = kx[id] * rU[id] + ky[id] * rV[id];
      const dotImag = kx[id] * iU[id] + ky[id] * iV[id];
      const damping = 1 / (1 + dt * params.viscosity * laplacianSymbol[id]);
      rU[id] = (rU[id] - kx[id] * dotReal * inverseK2) * damping;
      iU[id] = (iU[id] - kx[id] * dotImag * inverseK2) * damping;
      rV[id] = (rV[id] - ky[id] * dotReal * inverseK2) * damping;
      iV[id] = (iV[id] - ky[id] * dotImag * inverseK2) * damping;
    }

    inverseReal(rU, iU, u);
    inverseReal(rV, iV, v);
  }

  function advancePhase(dt) {
    forwardReal(phi, rPhi, iPhi);
    forwardReal(nonlinear, rNonlinear, iNonlinear);
    forwardReal(advPhi, rAdv, iAdv);
    const epsilon2 = params.epsilon * params.epsilon;

    for (let id = 0; id &lt; SIZE; id++) {
      if (!dealiased[id]) {
        rNonlinear[id] = 0; iNonlinear[id] = 0;
        rAdv[id] = 0; iAdv[id] = 0;
      }
      if (laplacianSymbol[id] === 0) {
        iPhi[id] = 0;
        continue;
      }
      const relaxation = params.mobility * laplacianSymbol[id] + params.reaction;
      const denominator = 1 + dt * relaxation * epsilon2 * laplacianSymbol[id];
      rPhi[id] = (rPhi[id] - dt * rAdv[id] - dt * relaxation * rNonlinear[id]) / denominator;
      iPhi[id] = (iPhi[id] - dt * iAdv[id] - dt * relaxation * iNonlinear[id]) / denominator;
    }

    inverseReal(rPhi, iPhi, phi);
    let mean = 0;
    for (let i = 0; i &lt; SIZE; i++) mean += phi[i];
    const correction = targetMeanPhi - mean / SIZE;
    for (let i = 0; i &lt; SIZE; i++) phi[i] += correction;
  }

  function takeStep() {
    const cflDt = 0.22 * DX / Math.max(lastMaxSpeed, 0.15);
    const dt = Math.min(BASE_DT, cflDt);
    buildSpatialTerms(dt);
    projectVelocity(dt);
    advancePhase(dt);

    lastMaxSpeed = 0;
    let finite = true;
    for (let i = 0; i &lt; SIZE; i++) {
      const speed = Math.hypot(u[i], v[i]);
      lastMaxSpeed = Math.max(lastMaxSpeed, speed);
      if (!Number.isFinite(phi[i]) || !Number.isFinite(speed) || Math.abs(phi[i]) &gt; 8 || speed &gt; 40) {
        finite = false;
        break;
      }
    }

    if (!finite) {
      running = false;
      initialize();
      running = false;
      updateRunButton();
      refs.error.textContent = &#x27;That parameter combination became numerically stiff; the field was reinitialized and paused.&#x27;;
      refs.error.hidden = false;
      return false;
    }

    simTime += dt;
    stepCount++;
    return true;
  }

  function oilFraction() {
    let total = 0;
    for (let i = 0; i &lt; SIZE; i++) total += 0.5 * (phi[i] + 1);
    return total / SIZE;
  }

  function rmsSpeed() {
    let total = 0;
    for (let i = 0; i &lt; SIZE; i++) total += u[i] * u[i] + v[i] * v[i];
    return Math.sqrt(total / SIZE);
  }

  function countRegions() {
    visited.fill(0);
    let regions = 0;
    for (let start = 0; start &lt; SIZE; start++) {
      if (visited[start] || phi[start] &lt;= 0) continue;
      let head = 0;
      let tail = 0;
      let cells = 0;
      queue[tail++] = start;
      visited[start] = 1;
      while (head &lt; tail) {
        const id = queue[head++];
        cells++;
        const a = left[id];
        const b = right[id];
        const c = up[id];
        const d = down[id];
        if (!visited[a] &amp;&amp; phi[a] &gt; 0) { visited[a] = 1; queue[tail++] = a; }
        if (!visited[b] &amp;&amp; phi[b] &gt; 0) { visited[b] = 1; queue[tail++] = b; }
        if (!visited[c] &amp;&amp; phi[c] &gt; 0) { visited[c] = 1; queue[tail++] = c; }
        if (!visited[d] &amp;&amp; phi[d] &gt; 0) { visited[d] = 1; queue[tail++] = d; }
      }
      if (cells &gt;= 3) regions++;

    return regions;
  }

  const colorProbe = document.createElement(&#x27;span&#x27;);
  colorProbe.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
  colorProbe.style.position = &#x27;absolute&#x27;;
  colorProbe.style.visibility = &#x27;hidden&#x27;;
  colorProbe.style.pointerEvents = &#x27;none&#x27;;
  root.appendChild(colorProbe);
  const colorCanvas = document.createElement(&#x27;canvas&#x27;);
  colorCanvas.width = 1;
  colorCanvas.height = 1;
  const colorCtx = colorCanvas.getContext(&#x27;2d&#x27;);
  let palette = null;

  function resolveThemeColor(token, fallback) {
    colorProbe.style.color = `var(${token}, var(${fallback}))`;
    const computed = getComputedStyle(colorProbe).color;
    colorCtx.clearRect(0, 0, 1, 1);
    colorCtx.fillStyle = computed;
    colorCtx.fillRect(0, 0, 1, 1);
    const pixel = colorCtx.getImageData(0, 0, 1, 1).data;
    return [pixel[0], pixel[1], pixel[2]];
  }

  function refreshPalette() {
    palette = {
      oil: resolveThemeColor(&#x27;--viz-series-1&#x27;, &#x27;--foreground&#x27;),
      water: resolveThemeColor(&#x27;--viz-series-2&#x27;, &#x27;--muted&#x27;),
      interface: resolveThemeColor(&#x27;--viz-series-3&#x27;, &#x27;--accent&#x27;),
      vector: resolveThemeColor(&#x27;--foreground&#x27;, &#x27;--foreground&#x27;)
    };
  }

  function drawVectors() {
    if (!refs.vectors.checked) return;
    const width = canvas.width;
    const stride = 8;
    const spacing = width * stride / N;
    const arrowMax = spacing * 0.38;
    ctx.save();
    ctx.strokeStyle = `rgba(${palette.vector[0]}, ${palette.vector[1]}, ${palette.vector[2]}, 0.72)`;
    ctx.lineWidth = Math.max(1, width / 640);
    ctx.lineCap = &#x27;round&#x27;;
    ctx.lineJoin = &#x27;round&#x27;;
    for (let y = stride / 2; y &lt; N; y += stride) {
      for (let x = stride / 2; x &lt; N; x += stride) {
        const id = Math.floor(y) * N + Math.floor(x);
        const speed = Math.hypot(u[id], v[id]);
        if (speed &lt; 1e-5) continue;
        const length = arrowMax * Math.min(1, speed / Math.max(lastMaxSpeed * 0.65, 1e-6));
        const dx = u[id] / speed * length;
        const dy = v[id] / speed * length;
        const cx = x / N * width;
        const cy = y / N * width;
        const x0 = cx - dx * 0.5;
        const y0 = cy - dy * 0.5;
        const x1 = cx + dx * 0.5;
        const y1 = cy + dy * 0.5;

        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.lineTo(x1 - head * Math.cos(angle - 0.55), y1 - head * Math.sin(angle - 0.55));
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1 - head * Math.cos(angle + 0.55), y1 - head * Math.sin(angle + 0.55));
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function render() {
    if (!palette) refreshPalette();
    const pixels = fieldImage.data;
    for (let i = 0; i &lt; SIZE; i++) {
      const phase = Math.max(-1, Math.min(1, phi[i]));
      const oilWeight = 0.5 * (phase + 1);
      const interfaceWeight = 0.58 * Math.exp(-7 * phase * phase);
      const baseR = palette.water[0] * (1 - oilWeight) + palette.oil[0] * oilWeight;

      pixels[p] = baseR * (1 - interfaceWeight) + palette.interface[0] * interfaceWeight;
      pixels[p + 1] = baseG * (1 - interfaceWeight) + palette.interface[1] * interfaceWeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(fieldCanvas, 0, 0, canvas.width, canvas.height);

  }

  function updateStatus() {
    const oil = oilFraction();
    lastRegions = countRegions();
    const drift = (oil - initialOil) * 100;
    const driftText = `${drift &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}${drift.toFixed(3)}%`;
    refs.time.textContent = simTime.toFixed(2);
    refs.area.textContent = `${(oil * 100).toFixed(1)}% (${driftText})`;
    refs.regions.textContent = String(lastRegions);
    refs.speed.textContent = rmsSpeed().toFixed(3);
    canvas.setAttribute(&#x27;aria-label&#x27;, `Periodic oil-water phase field at nondimensional time ${simTime.toFixed(2)}. ${lastRegions} oil regions remain from 20 initial droplets. Oil area is ${(oil * 100).toFixed(1)} percent.`);
  }

  function updateRunButton() {
    refs.run.textContent = running ? &#x27;Pause&#x27; : &#x27;Run&#x27;;
  }

  function resizeCanvas() {
    const cssWidth = canvas.clientWidth;
    if (!cssWidth) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const size = Math.max(1, Math.round(cssWidth * dpr));
    if (canvas.width !== size || canvas.height !== size) {
      canvas.width = size;
      canvas.height = size;
      render();
    }
  }

  function bindRange(id, key, digits, restartOnChange, integer) {
    const input = root.querySelector(`#${id}`);
    const output = root.querySelector(`#${id}-out`);
    const apply = () =&gt; {
      params[key] = integer ? Math.round(Number(input.value)) : Number(input.value);
      output.textContent = integer ? String(params[key]) : params[key].toFixed(digits);
    };
    input.addEventListener(&#x27;input&#x27;, () =&gt; {
      apply();
      if (!restartOnChange) updateStatus();
    });
    if (restartOnChange) input.addEventListener(&#x27;change&#x27;, initialize);
    apply();
  }

  bindRange(&#x27;chns-mean-radius&#x27;, &#x27;meanRadius&#x27;, 3, true, false);
  bindRange(&#x27;chns-radius-sd&#x27;, &#x27;radiusSD&#x27;, 3, true, false);
  bindRange(&#x27;chns-epsilon&#x27;, &#x27;epsilon&#x27;, 3, true, false);
  bindRange(&#x27;chns-kick&#x27;, &#x27;kick&#x27;, 2, true, false);
  bindRange(&#x27;chns-tension&#x27;, &#x27;tension&#x27;, 2, false, false);
  bindRange(&#x27;chns-viscosity&#x27;, &#x27;viscosity&#x27;, 3, false, false);
  bindRange(&#x27;chns-mobility&#x27;, &#x27;mobility&#x27;, 4, false, false);
  bindRange(&#x27;chns-reaction&#x27;, &#x27;reaction&#x27;, 2, false, false);
  bindRange(&#x27;chns-rate&#x27;, &#x27;rate&#x27;, 0, false, true);

  refs.run.addEventListener(&#x27;click&#x27;, () =&gt; {
    running = !running;
    updateRunButton();
  });

  refs.step.addEventListener(&#x27;click&#x27;, () =&gt; {
    running = false;
    updateRunButton();
    if (takeStep()) {
      updateStatus();
      render();
    }
  });

  refs.vectors.addEventListener(&#x27;change&#x27;, render);

  const resizeObserver = new ResizeObserver(resizeCanvas);
  resizeObserver.observe(canvas);
  const themeObserver = new MutationObserver(() =&gt; {
    refreshPalette();
    render();
  });
  themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: [&#x27;class&#x27;, &#x27;style&#x27;, &#x27;data-theme&#x27;] });

  function loop(timestamp) {
    if (!root.isConnected) {
      resizeObserver.disconnect();
      themeObserver.disconnect();
      return;
    }
    if (running) {
      const started = performance.now();
      for (let i = 0; i &lt; params.rate; i++) {
        if (!takeStep()) break;
        if (performance.now() - started &gt; 28) break;
      }
      if (timestamp - lastStatusAt &gt;= 500) {
        updateStatus();
        lastStatusAt = timestamp;
      }
      render();
    }
    requestAnimationFrame(loop);
  }

  refreshPalette();
  initialize();
  requestAnimationFrame(resizeCanvas);
  requestAnimationFrame(loop);
})();
