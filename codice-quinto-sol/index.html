<title>Códice del Quinto Sol</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital@1&family=Alegreya+SC:wght@600;700&display=swap">
<style>
/* Layout: el códice como diorama de papel recortado, centrado sobre obsidiana; debajo, controles de íconos y el camino de huellas */
:root{
  --bg:#120d09; --wood:#3b2a1a; --woodHi:#5a4129; --fg:#ecdcbc; --muted:#8a7658;
  --ochre:#d6982f; --red:#b0302a; --rx:0deg; --ry:0deg;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{background:radial-gradient(ellipse at 50% 30%,#2c1d11 0%,var(--bg) 70%) fixed,var(--bg);overflow-x:hidden}
.wrap{min-height:100%;display:grid;place-content:center;gap:14px;padding-inline:16px;padding-block:18px}
.scene3d{perspective:1800px}
.codex{position:relative;width:min(calc(100vw - 32px),calc((100dvh - 120px) * 1.5),1200px);
  padding:10px;border-radius:3px;
  background:linear-gradient(160deg,#4a3420,#33241597 40%,#2a1d11),var(--wood);
  box-shadow:0 50px 90px -30px #000,0 18px 30px -18px #000,inset 0 0 0 1px var(--woodHi),inset 0 2px 0 #6b4e33;
  transform:rotateX(var(--rx)) rotateY(var(--ry));transition:transform .6s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.stage{position:relative;overflow:hidden;aspect-ratio:3/2;max-width:100%;background:#efe2c3;perspective:1800px;cursor:pointer;
  box-shadow:inset 0 0 0 1px #00000040}
.strip{display:flex;height:100%;transition:transform 1.3s cubic-bezier(.66,0,.3,1);transform-style:preserve-3d}
.leaf{flex:0 0 100%;width:100%;height:100%;display:block;transition:transform 1.3s cubic-bezier(.66,0,.3,1),filter 1.3s}
.leaf.before{transform-origin:100% 50%;transform:rotateY(34deg);filter:brightness(.5)}
.leaf.after{transform-origin:0 50%;transform:rotateY(-34deg);filter:brightness(.5)}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(50,26,6,.38) 100%),
  linear-gradient(90deg,rgba(60,35,10,.3),transparent 4%,transparent 96%,rgba(60,35,10,.3))}
.bar{height:3px;background:#2a1d12;margin-top:8px;border-radius:2px;overflow:hidden}
.prog{height:100%;width:0;background:linear-gradient(90deg,#a8701c,var(--ochre))}
.controls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:center}
.btns{display:flex;gap:8px}
button{color:var(--fg);background:#21180f;border:1px solid #4a3725;border-radius:50%;width:42px;height:42px;
  display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 4px 10px -4px #000}
button:hover{border-color:var(--ochre);color:var(--ochre)}
button:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}
button svg{width:18px;height:18px}
.play{background:var(--red);border-color:var(--red);color:#fff4e0;width:48px;height:48px}
.play:hover{color:#fff4e0;filter:brightness(1.1)}
.snd[aria-pressed="true"]{color:var(--ochre);border-color:var(--ochre)}
.steps{display:flex;gap:2px;align-items:center}
.steps button{width:auto;height:auto;border:0;border-radius:0;background:none;padding:2px 3px;color:#4f3d29;box-shadow:none}
.steps button.seen{color:var(--muted)}
.steps button.cur{color:var(--ochre)}
.steps svg{width:18px;height:24px;display:block}
.steps button:nth-child(odd) svg{transform:translateY(5px)}
/* producción cinematográfica */
.lbox{position:absolute;left:0;right:0;height:9%;background:#050302;z-index:4;pointer-events:none;transition:transform 1.6s cubic-bezier(.6,0,.2,1)}
.lbox.top{top:0;transform:translateY(-100%)}.lbox.bot{bottom:0;transform:translateY(100%)}
.cine .lbox{transform:none}
#grain{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;opacity:.14;mix-blend-mode:overlay;image-rendering:pixelated}
.leak{position:absolute;inset:-20%;z-index:2;pointer-events:none;mix-blend-mode:screen;opacity:.0;
  background:radial-gradient(circle at 20% 30%,rgba(255,150,60,.55),transparent 35%),radial-gradient(circle at 85% 70%,rgba(255,90,40,.35),transparent 30%)}
.card{position:absolute;inset:0;z-index:5;display:grid;place-content:center;text-align:center;gap:10px;background:#070403;color:#ecdcbc;
  opacity:0;pointer-events:none;transition:opacity 1.4s ease}
.card.on{opacity:1}
.card .k{font:600 clamp(10px,1.4vw,13px)/1 "Alegreya SC",Georgia,serif;letter-spacing:.42em;color:#d6982f;text-transform:uppercase}
.card .t{font:700 clamp(26px,5.6vw,64px)/1.05 "Alegreya SC",Georgia,serif;letter-spacing:.06em;text-wrap:balance}
.card .s{font:italic 400 clamp(13px,1.8vw,19px)/1.3 Alegreya,Georgia,serif;color:#b39f7c}
.card .t,.card .s,.card .k{opacity:0;transform:translateY(8px);transition:opacity 1.6s ease,transform 2.4s ease}
.card.on .t{opacity:1;transform:none;transition-delay:.6s}.card.on .s{opacity:1;transform:none;transition-delay:1.6s}.card.on .k{opacity:1;transform:none;transition-delay:.2s}
.card .rule{width:64px;height:2px;background:#b0302a;margin:4px auto}
.codex:fullscreen{width:100vw;height:100vh;padding:0;display:grid;place-items:center;background:#000;transform:none}
.codex:fullscreen .stage{width:min(100vw,150vh);cursor:none}
.codex:fullscreen .bar{display:none}
@media (max-width:560px){.codex{padding:5px}.steps svg{width:14px;height:20px}}
@media (prefers-reduced-motion:reduce){.strip,.leaf,.codex{transition:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8 0.035" numOctaves="3" seed="7"/>
      <feColorMatrix values="0 0 0 0 .42  0 0 0 0 .3  0 0 0 0 .16  0 0 0 .3 0"/>
    </filter>
    <filter id="stain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .32  0 0 0 0 .12  0 0 0 -1.6 .9"/>
    </filter>
    <!-- profundidad: cada capa de papel proyecta sombra sobre la de atrás -->
    <filter id="dFar" x="-5%" y="-5%" width="110%" height="115%">
      <feColorMatrix type="matrix" values=".72 0 0 0 .25  0 .72 0 0 .22  0 0 .72 0 .17  0 0 0 1 0" result="c"/>
      <feDropShadow in="c" dx="1.5" dy="2" stdDeviation="1.4" flood-color="#3a2410" flood-opacity=".22"/>
    </filter>
    <filter id="dMid" x="-5%" y="-5%" width="110%" height="115%">
      <feColorMatrix type="matrix" values=".9 0 0 0 .08  0 .9 0 0 .07  0 0 .9 0 .05  0 0 0 1 0" result="c"/>
      <feDropShadow in="c" dx="2.5" dy="3.5" stdDeviation="2.2" flood-color="#2e1a08" flood-opacity=".32"/>
    </filter>
    <filter id="dNear" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="4" dy="6" stdDeviation="3.2" flood-color="#251405" flood-opacity=".42"/>
    </filter>
    <filter id="dFore" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur stdDeviation=".7" result="b"/>
      <feDropShadow in="b" dx="7" dy="10" stdDeviation="6" flood-color="#1c0f04" flood-opacity=".48"/>
    </filter>
    <filter id="blur3" x="-50%" y="-200%" width="200%" height="500%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="inner"><rect x="15" y="15" width="570" height="370"/></clipPath>
    <linearGradient id="shd" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".32"/><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
    <linearGradient id="vshd" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
    <radialGradient id="orb" cx=".36" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset=".85" stop-color="#2a1206" stop-opacity=".1"/><stop offset="1" stop-color="#2a1206" stop-opacity=".38"/></radialGradient>
    <linearGradient id="ao" x1="0" x2="0" y1="0" y2="1"><stop offset=".55" stop-color="#3a1d06" stop-opacity="0"/><stop offset="1" stop-color="#3a1d06" stop-opacity=".3"/></linearGradient>
    <linearGradient id="stairG" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
    <pattern id="water" width="40" height="24" patternUnits="userSpaceOnUse">
      <rect width="40" height="24" fill="#2b8a9c"/>
      <path d="M0 16 q10 -10 20 0 t20 0" stroke="#c7e6e3" stroke-width="2" fill="none"/>
      <circle cx="10" cy="6" r="2.2" fill="#c7e6e3"/><circle cx="30" cy="20" r="1.6" fill="#c7e6e3"/>
    </pattern>
    <linearGradient id="waterDepth" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".3" stop-color="#0b3d48" stop-opacity="0"/><stop offset="1" stop-color="#0b3d48" stop-opacity=".45"/></linearGradient>
    <pattern id="fret" width="32" height="20" patternUnits="userSpaceOnUse">
      <rect width="32" height="20" fill="#b0302a"/>
      <path d="M0 16 H5 V12 H9 V8 H13 V4 H28 V14 H19 V9 H24" stroke="#f6ead0" stroke-width="2" fill="none"/>
    </pattern>
    <pattern id="jade" width="22" height="20" patternUnits="userSpaceOnUse">
      <rect width="22" height="20" fill="#d6982f"/><circle cx="11" cy="10" r="5.5" fill="#4e8c55" stroke="#1c140f" stroke-width="1.4"/><circle cx="9.5" cy="8.5" r="2" fill="#efe2c3"/>
    </pattern>
  </defs>
</svg>

<main class="wrap">
  <div class="scene3d">
    <section class="codex" id="codex" aria-label="Códice animado del Quinto Sol">
      <div class="stage cine" id="stage"><div class="strip" id="strip"></div>
        <div class="leak" id="leak"></div><canvas id="grain" width="180" height="120"></canvas>
        <div class="lbox top"></div><div class="lbox bot"></div>
        <div class="card" id="cardIn"><span class="k">Tenochtitlan · 1325 – 1521</span><span class="t">Códice del Quinto Sol</span><div class="rule"></div><span class="s">Nextlahualli · el pago de la deuda</span></div>
        <div class="card" id="cardOut"><span class="k">Ollin</span><span class="t">El Sol sigue andando</span><div class="rule"></div><span class="s">Animación inspirada en los códices Borbónico, Magliabechiano y Florentino</span></div>
      </div>
      <div class="bar"><div class="prog" id="prog"></div></div>
    </section>
  </div>
  <nav class="controls" aria-label="Lectura del códice">
    <div class="btns">
      <button id="prev" type="button" aria-label="Escena anterior"><svg viewBox="0 0 20 20"><path d="M13 3 L6 10 L13 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="play" class="play" type="button" aria-label="Pausa"></button>
      <button id="next" type="button" aria-label="Escena siguiente"><svg viewBox="0 0 20 20"><path d="M7 3 L14 10 L7 17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="fs" type="button" aria-label="Pantalla completa"><svg viewBox="0 0 20 20"><path d="M3 8 V3 H8 M12 3 H17 V8 M17 12 V17 H12 M8 17 H3 V12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button id="snd" class="snd" type="button" aria-label="Tambores" aria-pressed="false"><svg viewBox="0 0 20 20"><path d="M3 8 h3 l5 -4 v12 l-5 -4 h-3 z" fill="currentColor"/><path id="sndWave" d="M14 7 q2 3 0 6 M16 5 q4 5 0 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path id="sndOff" d="M14 7 l5 6 M19 7 l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
    <div class="steps" id="steps"></div>
  </nav>
</main>

<script>
const C={ink:'#1c140f',paper:'#efe2c3',red:'#b0302a',blue:'#2b8a9c',ochre:'#d6982f',jade:'#4e8c55',
  skin:'#c88a58',soot:'#2b2420',white:'#fbf5e6',stone:'#c9b088',sand:'#e3cc9a',brown:'#8d5a2b',night:'#141833'};
const o=`stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"`;
const tone=(hex,f)=>'#'+[1,3,5].map(i=>Math.max(0,Math.min(255,Math.round(parseInt(hex.slice(i,i+2),16)*f))).toString(16).padStart(2,'0')).join('');

/* =============== piezas del códice =============== */
const limb=(d,w,c)=>`<path d="${d}" fill="none" stroke="${C.ink}" stroke-width="${w+4}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="#000" stroke-opacity=".14" stroke-width="${w*.35}" stroke-linecap="round" stroke-linejoin="round" transform="translate(-1.6 0)"/>`;
// cuerpo en volumen: rectángulo frontal + cara lateral + tapa
const slab=(x,y,w,h,fill,dx=7,dy=5,sw=1.4)=>`<path d="M${x} ${y} l${dx} ${-dy} h${w} l${-dx} ${dy}Z" fill="${tone(fill,1.1)}" ${o} stroke-width="${sw*.8}"/><path d="M${x+w} ${y} l${dx} ${-dy} v${h} l${-dx} ${dy}Z" fill="${tone(fill,.7)}" ${o} stroke-width="${sw*.8}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" ${o} stroke-width="${sw}"/>`;

function person(p){
  const sk=p.skin||C.skin, bd=p.body||sk, s=p.s||1, fl=p.flip?-1:1;
  const LEGS={stand:[[-6,-46,-8,-23,-8,0],[6,-46,8,-23,10,0]],
              walk:[[-6,-46,-12,-23,-20,0],[6,-46,12,-24,16,0]],
              climb:[[-6,-46,-10,-22,-14,0],[6,-46,22,-36,20,-12]]};
  const lg=LEGS[p.legs||'stand'];
  const leg=a=>limb(`M${a[0]} ${a[1]} L${a[2]} ${a[3]} L${a[4]} ${a[5]}`,9,sk)+`<path d="M${a[4]-6} ${a[5]+1} h17 q2 -6 -4 -7 h-13 z" fill="${C.ochre}" ${o}/>`;
  const arm=pts=>pts?limb('M2 -78 '+pts.map(q=>'L'+q.join(' ')).join(' '),8,sk)+`<circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="4.5" fill="${sk}" ${o}/>`:'';
  let g='';
  if(p.shadow!==false) g+=`<ellipse cx="${fl*4}" cy="1" rx="26" ry="5" fill="#2a1406" opacity=".32" filter="url(#blur3)"/>`;
  if(p.helm==='priest') g+=`<path d="M-17 -118 Q-34 -90 -26 -64 L-12 -70 L-12 -86 Z" fill="${C.soot}" ${o}/>`;
  if(p.plume) g+=`<path d="M-14 -122 C-40 -150 -54 -120 -60 -96 M-10 -126 C-30 -168 -50 -150 -58 -130 M-4 -128 C-10 -170 -30 -176 -40 -160" fill="none" stroke="${C.ink}" stroke-width="9" stroke-linecap="round"/><path d="M-14 -122 C-40 -150 -54 -120 -60 -96 M-10 -126 C-30 -168 -50 -150 -58 -130 M-4 -128 C-10 -170 -30 -176 -40 -160" fill="none" stroke="${p.plume}" stroke-width="5" stroke-linecap="round"/><path d="M-14 -122 C-40 -150 -54 -120 -60 -96" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.5"/>`;
  if(p.cape) g+=`<path id="${p.id?p.id+'-cape':''}" d="M-12 -84 L-30 -36 L-4 -40 Z" fill="${tone(p.cape,.85)}" ${o}/>`;
  g+=arm(p.armB);
  if(p.shield&&p.armB){const h=p.armB.at(-1);g+=`<circle cx="${h[0]}" cy="${h[1]}" r="17" fill="${C.white}" ${o}/><path d="M${h[0]-17} ${h[1]} h34" stroke="${C.red}" stroke-width="5"/><circle cx="${h[0]}" cy="${h[1]-7}" r="3" fill="${C.jade}"/><circle cx="${h[0]}" cy="${h[1]+7}" r="3" fill="${C.jade}"/><circle cx="${h[0]}" cy="${h[1]}" r="17" fill="url(#orb)"/>${[-10,0,10].map(x=>`<path d="M${h[0]+x} ${h[1]+16} l-2 12 l4 0 z" fill="${C.ochre}" ${o} stroke-width="1"/>`).join('')}`;}
  g+=leg(lg[0])+leg(lg[1]);
  const torso='M-13 -84 L13 -84 L15 -46 L-15 -46 Z';
  g+=`<path d="${torso}" fill="${bd}" ${o}/>`;
  if(p.stripes) g+=`<path d="M-13 -74 H13 M-14 -64 H14 M-14 -55 H14" stroke="${C.red}" stroke-width="3.5"/>`;
  if(p.sores) g+=[[-6,-76],[5,-66],[-4,-58],[8,-78],[2,-54]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="2.3" fill="${C.red}"/>`).join('');
  if(p.feathers) g+=`<path d="M-13 -84 L13 -84 L14 -70 L-14 -70Z" fill="${p.feathers===true?C.jade:p.feathers}" ${o}/>`;
  g+=`<path d="${torso}" fill="url(#shd)"/>`;
  if(p.necklace) g+=`<path d="M-10 -84 Q0 -70 10 -84" fill="none" stroke="${C.jade}" stroke-width="4"/><circle cx="0" cy="-74" r="3" fill="${C.jade}" ${o} stroke-width="1"/>`;
  g+=`<rect x="-16" y="-52" width="32" height="8" fill="${C.white}" ${o}/><path d="M8 -44 L18 -44 L15 -28 L9 -28 Z" fill="${C.white}" ${o}/><path d="M9.6 -33 L15.6 -33 L15 -28 L9 -28Z" fill="${C.red}"/><rect x="-16" y="-52" width="32" height="8" fill="url(#vshd)"/>`;
  const face=p.face||sk, faceD='M-16 -84 L-16 -112 Q-16 -124 0 -124 L14 -124 Q20 -124 20 -116 L20 -108 L26 -101 L20 -98 L20 -92 Q20 -84 12 -84 Z';
  g+=`<path d="${faceD}" fill="${face}" ${o}/><path d="${faceD}" fill="url(#shd)" opacity=".8"/>`;
  g+=`<path d="M-17 -86 L-17 -114 Q-17 -127 2 -127 L17 -127 L17 -119 L3 -119 Q-5 -119 -5 -111 L-5 -86 Z" fill="${C.ink}"/><path d="M-12 -120 Q-4 -125 10 -124" stroke="#fff" stroke-opacity=".25" stroke-width="1.5" fill="none"/>`;
  if(p.paint) g+=`<rect x="-4" y="-112" width="24" height="8" fill="${p.paint}"/>`;
  g+=`<ellipse cx="10" cy="-108" rx="4.5" ry="2.8" fill="${C.white}" ${o} stroke-width="1.4"/><circle cx="11" cy="-108" r="1.5" fill="${C.ink}"/>`;
  g+=`<path d="M13 -92 H20" stroke="${C.ink}" stroke-width="1.6"/><circle cx="-1" cy="-99" r="4.6" fill="${C.jade}" ${o} stroke-width="1.5"/><circle cx="-2.4" cy="-100.5" r="1.4" fill="#fff" opacity=".6"/>`;
  if(p.down) g+=`<g id="${p.id?p.id+'-down':''}">`+[[-12,-126],[-2,-130],[8,-129],[-15,-116],[15,-131]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.6" fill="${C.white}" ${o} stroke-width="1.2"/>`).join('')+`</g>`;
  if(p.helm==='priest') g+=`<circle cx="-11" cy="-108" r="4" fill="${C.red}"/>`;
  if(p.helm==='eagle') g+=`<path d="M-20 -110 Q-14 -142 16 -136 L36 -124 L22 -120 L20 -114 L-6 -114 L-12 -84 L-20 -84 Z" fill="${C.ochre}" ${o}/><path d="M-20 -110 Q-14 -142 16 -136 L36 -124 L22 -120 L20 -114 L-6 -114 L-12 -84 L-20 -84 Z" fill="url(#vshd)"/><path d="M20 -88 L34 -86 L20 -81 Z" fill="${C.ochre}" ${o}/><circle cx="6" cy="-128" r="3" fill="${C.ink}"/><path d="M-18 -128 l-14 -14 M-16 -120 l-18 -6 M-18 -112 l-16 2" stroke="${C.brown}" stroke-width="4" stroke-linecap="round"/>`;
  if(p.helm==='jaguar') g+=`<path d="M-20 -110 Q-16 -140 14 -134 L28 -122 L20 -116 L-6 -114 L-12 -84 L-20 -84 Z" fill="${C.ochre}" ${o}/><path d="M-20 -110 Q-16 -140 14 -134 L28 -122 L20 -116 L-6 -114 L-12 -84 L-20 -84 Z" fill="url(#vshd)"/><circle cx="-8" cy="-128" r="2.4" fill="${C.ink}"/><circle cx="4" cy="-130" r="2.4" fill="${C.ink}"/><circle cx="-14" cy="-100" r="2.4" fill="${C.ink}"/><path d="M14 -122 l4 6 l3 -6" fill="${C.white}" ${o} stroke-width="1"/><path d="M-6 -134 l2 -10 l6 8" fill="${C.ochre}" ${o} stroke-width="1.3"/>`;
  if(p.helm==='huitzi') g+=`<path d="M-20 -112 Q-14 -144 14 -134 L20 -126 L-6 -116 L-12 -84 L-20 -84 Z" fill="${C.blue}" ${o}/><path d="M-20 -112 Q-14 -144 14 -134 L20 -126 L-6 -116 L-12 -84 L-20 -84 Z" fill="url(#vshd)"/><path d="M16 -131 L46 -128 L18 -124 Z" fill="${C.ink}"/><path d="M-18 -134 q-6 -16 6 -22 M-12 -136 q0 -18 12 -20" stroke="${C.jade}" stroke-width="5" fill="none" stroke-linecap="round"/><rect x="0" y="-104" width="20" height="4" fill="${C.ochre}"/>`;

const op=(id,v)=>{const el=$(id);if(el)el.setAttribute('opacity',Math.max(0,Math.min(1,v)).toFixed(3))};
const flap=(id,t,f=50)=>{const w=$(id+'w');if(w)w.setAttribute('transform',`scale(1 ${Math.sin(t*f).toFixed(2)})`)};
let mx=0,my=0,tmx=0,tmy=0,wt=0,shake=0;
const LAYERS=[];
function cam(k,t,d,cx=300,cy=200,zm=.05,extra=0){

    el.setAttribute('transform',`translate(${cx} ${cy}) scale(${s.toFixed(4)}) translate(${(-cx-px*z).toFixed(2)} ${(-cy-py*z).toFixed(2)})`);

}
const light=(k,x,y,r=460)=>{const g=$('lg'+k);if(g){g.setAttribute('cx',x.toFixed(1));g.setAttribute('cy',y.toFixed(1));g.setAttribute('r',r.toFixed(0))}};

/* =============== sonido: huehuetl, teponaztli, ayoyotes, caracol =============== */
let AC=null, master=null, noise=null, soundOn=false, nextNote=0, step=0;
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=.55;
  const comp=AC.createDynamicsCompressor(); master.connect(comp).connect(AC.destination);
  noise=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate); const d=noise.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function env(g,t0,a,peak,dec){g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+dec)}
function huehuetl(t0,v=.9,f=72){const os=AC.createOscillator(),g=AC.createGain();os.frequency.setValueAtTime(f*2,t0);os.frequency.exponentialRampToValueAtTime(f*.6,t0+.3);env(g,t0,.005,v,.55);os.connect(g).connect(master);os.start(t0);os.stop(t0+.7)}
function tepo(t0,f){const os=AC.createOscillator(),g=AC.createGain();os.type='triangle';os.frequency.value=f;env(g,t0,.003,.32,.16);os.connect(g).connect(master);os.start(t0);os.stop(t0+.25)}
function rattle(t0,v=.12){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noise;f.type='bandpass';f.frequency.value=5200;f.Q.value=1.2;env(g,t0,.004,v,.08);s.connect(f).connect(g).connect(master);s.start(t0);s.stop(t0+.12)}
function conch(t0,dur=2.6){const g=AC.createGain(),f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
  [110,110.8,220.4].forEach((fr,i)=>{const os=AC.createOscillator();os.type='sawtooth';os.frequency.setValueAtTime(fr*.94,t0);os.frequency.linearRampToValueAtTime(fr,t0+.5);
    const v=AC.createOscillator(),vg=AC.createGain();v.frequency.value=5;vg.gain.value=1.5;v.connect(vg).connect(os.frequency);v.start(t0);v.stop(t0+dur);
    const og=AC.createGain();og.gain.value=i===2?.25:.5;os.connect(og).connect(f);os.start(t0);os.stop(t0+dur)});
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.32,t0+.45);g.gain.setValueAtTime(.32,t0+dur-.8);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);f.connect(g).connect(master)}
const CUE={boom:t0=>{huehuetl(t0,1.2,52);huehuetl(t0+.02,.6,90)},conch:t0=>conch(t0),rattle:t0=>{for(let i=0;i<6;i++)rattle(t0+i*.05,.16)}};
const PAT={h:[0,6,8,11,14],tl:[2,10],th:[4,12,13],r:[1,3,5,7,9,11,13,15]};
setInterval(()=>{
  if(!AC||!soundOn)return;
  if(nextNote<AC.currentTime)nextNote=AC.currentTime+.05;
  while(nextNote<AC.currentTime+.2){
    if(playing&&!(cur===5&&t>2.6&&t<3.45)){
      if(PAT.h.includes(step))huehuetl(nextNote,step===0?.95:.6);
      if(PAT.tl.includes(step))tepo(nextNote,330);if(PAT.th.includes(step))tepo(nextNote,440);
      if(PAT.r.includes(step))rattle(nextNote)}
    step=(step+1)%16; nextNote+=.19;
  }
},40);

/* =============== motor =============== */
const strip=$('strip'), steps=$('steps'), stage=$('stage'), codex=$('codex');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
strip.innerHTML=scenes.map((s,i)=>`<svg class="leaf" viewBox="0 0 600 400" role="img" aria-label="${s.name}" preserveAspectRatio="xMidYMid meet">${s.svg(i)}</svg>`).join('');
const leaves=[...strip.children];
leaves.forEach((svg,k)=>LAYERS[k]=[...svg.querySelectorAll('.ly')].map(el=>({el,z:+el.dataset.z})));
const foot=`<svg viewBox="0 0 20 26" aria-hidden="true"><path d="M10 25 C4 22 4 14 6 10 C8 6 14 6 15 11 C16 16 14 22 12 25 Z" fill="currentColor"/><circle cx="6.5" cy="5" r="2" fill="currentColor"/><circle cx="10" cy="3" r="2.1" fill="currentColor"/><circle cx="13.5" cy="4" r="1.9" fill="currentColor"/><circle cx="16" cy="7" r="1.5" fill="currentColor"/></svg>`;
steps.innerHTML=scenes.map((s,i)=>`<button type="button" aria-label="${s.name}" data-i="${i}">${foot}</button>`).join('');
const ICON={play:'<svg viewBox="0 0 20 20"><path d="M6 3 L17 10 L6 17Z" fill="currentColor"/></svg>',pause:'<svg viewBox="0 0 20 20"><rect x="4" y="3" width="4.5" height="14" fill="currentColor"/><rect x="11.5" y="3" width="4.5" height="14" fill="currentColor"/></svg>'};

let cur=0, t=0, playing=!reduce, last=performance.now(), seen=new Set([0]), phase=reduce?'film':'intro', pt=0;
scenes.forEach((s,i)=>{try{s.update(0,i)}catch(e){console.error(e)}});

function show(i){
  const prev=cur; cur=(i+scenes.length)%scenes.length; t=reduce?scenes[cur].d-.01:0; seen.add(cur);
  scenes[cur].update(t,cur);
  strip.style.transform=`translateX(${-cur*100}%)`;
  leaves.forEach((l,k)=>{l.classList.toggle('before',k<cur);l.classList.toggle('after',k>cur)});
  [...steps.children].forEach((b,k)=>{b.classList.toggle('cur',k===cur);b.classList.toggle('seen',seen.has(k)&&k!==cur);b.setAttribute('aria-current',k===cur?'step':'false')});
  if(soundOn&&AC&&prev!==cur)conch(AC.currentTime+.05,2);
}
const gc=$('grain').getContext('2d'), gimg=gc.createImageData(180,120); let gLast=0;
function grainFrame(now){if(reduce||now-gLast<41)return;gLast=now;const d=gimg.data;for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}gc.putImageData(gimg,0,0)}
function setPlay(v){playing=v;$('play').innerHTML=v?ICON.pause:ICON.play;$('play').setAttribute('aria-label',v?'Pausa':'Reproducir')}
function loop(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  if(!reduce){wt+=dt; mx+=(tmx-mx)*Math.min(1,dt*3); my+=(tmy-my)*Math.min(1,dt*3);}
  codex.style.setProperty('--ry',(mx*4).toFixed(2)+'deg'); codex.style.setProperty('--rx',(-my*3).toFixed(2)+'deg');
  const sc=scenes[cur];
  shake=Math.max(0,shake-dt*1.6);
  if(playing&&phase==='intro'){pt+=dt;if(pt>6.5){phase='film';$('cardIn').classList.remove('on')}}
  else if(playing&&phase==='outro'){pt+=dt;if(pt>7){phase='intro';pt=0;$('cardOut').classList.remove('on');show(0);setTimeout(()=>$('cardIn').classList.add('on'),900)}}
  else if(playing){
    const t0=t; t+=dt;
    if(sc.cues)sc.cues.forEach(([ct,c])=>{if(t0<ct&&t>=ct){if(c==='boom')shake=1;if(soundOn&&AC)CUE[c](AC.currentTime+.01)}});
    if(t>=sc.d){if(cur===scenes.length-1){phase='outro';pt=0;$('cardOut').classList.add('on')}else show(cur+1)}
  }
  grainFrame(now);
  $('leak').style.opacity=(.1+.12*Math.sin(wt*.31)**2+.18*shake).toFixed(3);
  $('leak').style.transform=`translate(${(Math.sin(wt*.13)*6).toFixed(2)}%,${(Math.cos(wt*.11)*4).toFixed(2)}%)`;
  strip.style.translate=reduce?'':`${((Math.random()-.5)*.6).toFixed(2)}px ${((Math.random()-.5)*.6).toFixed(2)}px`;
  try{scenes[cur].update(Math.min(t,scenes[cur].d),cur)}catch(e){console.error(e)}
  const wp=document.querySelector('#water');if(wp)wp.setAttribute('patternTransform',`translate(${((wt*9)%40).toFixed(2)} 0)`);
  $('prog').style.width=(phase==='film'?Math.min(t,scenes[cur].d)/scenes[cur].d*100:phase==='intro'?0:100).toFixed(2)+'%';
  requestAnimationFrame(loop);
}
function setSound(v){soundOn=v;if(v&&!AC)initAudio();if(AC&&AC.state==='suspended')AC.resume();
  $('snd').setAttribute('aria-pressed',v);$('sndWave').style.display=v?'':'none';$('sndOff').style.display=v?'none':'';
  if(v)conch(AC.currentTime+.05,2.4)}
const skipCards=()=>{if(phase!=='film'){phase='film';$('cardIn').classList.remove('on');$('cardOut').classList.remove('on')}};
$('prev').onclick=()=>{skipCards();show(cur-1)};
$('fs').onclick=()=>{const f=document.fullscreenElement?document.exitFullscreen():codex.requestFullscreen?.();f?.catch?.(()=>{})};
$('next').onclick=()=>{skipCards();show(cur+1)};
$('play').onclick=()=>setPlay(!playing);
$('snd').onclick=()=>setSound(!soundOn);
stage.onclick=()=>setPlay(!playing);
stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();tmx=((e.clientX-r.left)/r.width-.5)*2;tmy=((e.clientY-r.top)/r.height-.5)*2});
stage.addEventListener('pointerleave',()=>{tmx=0;tmy=0});
steps.onclick=e=>{const b=e.target.closest('button');if(b){skipCards();show(+b.dataset.i)}};
addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);if(e.key===' '&&e.target===document.body){e.preventDefault();setPlay(!playing)}});
setPlay(playing); setSound(false); show(0); if(phase==='intro')requestAnimationFrame(()=>$('cardIn').classList.add('on')); requestAnimationFrame(loop);
</script>
