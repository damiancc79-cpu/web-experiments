<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Brick London — 3D LEGO-style City</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0a1226;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  #ui{position:fixed;left:14px;top:14px;z-index:10;display:flex;flex-direction:column;gap:9px;width:216px;}
  .panel{background:rgba(14,18,32,.66);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.13);border-radius:15px;padding:12px 13px;color:#eef1fa;
    box-shadow:0 14px 40px rgba(0,0,0,.4);}
  h1{margin:0 0 3px;font-size:15px;letter-spacing:.01em;}
  .sub{margin:0;font-size:10.5px;line-height:1.5;color:#99a5c4;}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;}
  button{appearance:none;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.07);
    color:#eef1fa;font-size:11px;font-weight:600;padding:6px 9px;border-radius:9px;cursor:pointer;
    transition:.14s;font-family:inherit;white-space:nowrap;}
  button:hover{background:rgba(255,255,255,.17);}
  button.on{background:#ffd23f;border-color:#ffd23f;color:#20160a;}
  button.tour{flex:1 1 auto;text-align:left;font-weight:500;font-size:10.5px;padding:5px 8px;}
  .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#7c88a8;margin:11px 0 4px;}
  input[type=range]{width:100%;accent-color:#ffd23f;height:16px;}
  #stats{position:fixed;right:13px;bottom:13px;z-index:10;font-size:10px;color:#8b96b4;
    background:rgba(14,18,32,.6);padding:6px 10px;border-radius:9px;
    border:1px solid rgba(255,255,255,.09);font-variant-numeric:tabular-nums;text-align:right;line-height:1.6;}
  #hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;z-index:9;font-size:10.5px;
    color:rgba(255,255,255,.4);pointer-events:none;}
  #boot{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
    background:#0a1226;color:#cfd8ee;font-size:13px;letter-spacing:.04em;transition:opacity .5s;}
  @media (max-width:680px){#ui{width:150px;left:8px;top:8px;} #hint{display:none;} .sub{display:none;}}
</style>
</head>
<body>
<div id="app"></div>
<div id="boot">assembling bricks…</div>

<div id="ui">
  <div class="panel">
    <h1>🇬🇧 Brick London</h1>
    <p class="sub">96×96 baseplate on the Thames.</p>
    <div class="row">
      <button id="regen">↻ Rebuild</button>
      <button id="night">🌙 Night</button>
    </div>
    <div class="row">
      <button id="spin" class="on">◉ Orbit</button>
      <button id="traffic" class="on">🚌 Motion</button>
    </div>
    <div class="lbl">Fly to</div>
    <div class="row" id="tours"></div>
    <div class="lbl">Building density</div>
    <input id="density" type="range" min="20" max="100" value="74">
    <div class="lbl">Exposure</div>
    <input id="exposure" type="range" min="55" max="150" value="100">
  </div>
</div>

<div id="stats">–</div>
<div id="hint">drag to orbit · scroll to zoom · right-drag to pan</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

/* ══════════════════════════════════════════════════════════════════════════
   1.  LEGO METRICS  (true LDU ratios: 8mm stud pitch, 9.6mm brick, 3.2mm plate)
   ══════════════════════════════════════════════════════════════════════════ */
const BRICK = 1.2, PLATE = 0.4, GAP = 0.035;
const SR = 0.295, SH = 0.21;          // stud radius / height
const N = 96;                          // baseplate, in studs
const wx = s => s - N/2;               // stud → world

/* ── palette: real LEGO colour IDs where they exist ── */
const C = {
  // London specifics
  busRed:0xC91A09, postRed:0xB40000, brick:0x8A3B2E, brickDark:0x6B2C22,
  portland:0xE9E4D4, stone:0xD8D2C0, slate:0x4A4F52, lead:0x5C6165,
  thames:0x2E86A8, thamesLit:0x6EC2DA, gold:0xD1A83C, brass:0xB08A2E,
  cab:0x1A1A1A, tube:0x0B2E6F,
  // classics
  red:0xC4281B, orange:0xF57C20, yellow:0xF6CD1E, brightYellow:0xFFD500,
  green:0x237841, brightGreen:0x4B9F4A, lime:0xA5CA18, darkGreen:0x184632,
  blue:0x0055BF, medBlue:0x5A93DB, lightBlue:0xB4D2E3, azure:0x078BC9,
  tan:0xE4CD9E, darkTan:0xB09C7B, sand:0xD9BB7B,
  brown:0x582A12, redBrown:0x7C503A, white:0xF4F4F4,
  lightGray:0xA0A5A9, darkGray:0x6C6E68, blueGray:0x9BA19D,
  darkBlueGray:0x595D60, black:0x212121, teal:0x008F9B, purple:0x81007B,
  glass:0x8FC7DE, glassDark:0x2E5A73, glassGreen:0x6FA88C,
};
const TERRACE = [C.brick, C.brickDark, C.redBrown, C.portland, C.stone, C.darkTan];
const OFFICE  = [C.portland, C.stone, C.lightGray, C.blueGray, C.tan, C.white];
const TRIM    = [C.white, C.portland, C.lightGray];
const DOORC   = [0x1B3A5C, 0x123D2A, C.brickDark, C.black, 0x5C1010, 0x2B2B2B];

/* ── deterministic RNG ── */
let _s = 1;
const seed = v => { _s = (v>>>0) || 1; };
function rnd(){ _s^=_s<<13; _s>>>=0; _s^=_s>>17; _s^=_s<<5; _s>>>=0; return _s/4294967296; }
const ri = (a,b)=> a + Math.floor(rnd()*(b-a+1));
const pick = a => a[Math.floor(rnd()*a.length)];
const chance = p => rnd() < p;

/* ══════════════════════════════════════════════════════════════════════════
   2.  RENDERER  —  ACES + sRGB for the glossy-plastic look
   ══════════════════════════════════════════════════════════════════════════ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
let EXPOSURE = 1.0;
renderer.toneMappingExposure = 1.00;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth/innerHeight, 0.6, 1400);

/* ══════════════════════════════════════════════════════════════════════════
   3.  SKY  —  painted equirectangular panorama, doubles as the reflection probe
   ══════════════════════════════════════════════════════════════════════════ */
const SUNDIR = new THREE.Vector3(0.505, 0.772, 0.386).normalize();
const MOONDIR = new THREE.Vector3(-0.42, 0.70, -0.58).normalize();

function dirToUV(d){                     // matches three's equirect sampling
  return [ Math.atan2(d.z, d.x)/(2*Math.PI) + 0.5,
           Math.asin(Math.max(-1,Math.min(1,d.y)))/Math.PI + 0.5 ];
}

function cumulus(g, cx, cy, w, h, alpha, tint){
  const puffs = 7 + Math.floor(rnd()*6);
  for(let i=0;i<puffs;i++){
    const t = i/(puffs-1);
    const px = cx + (t-0.5)*w*0.92 + (rnd()-0.5)*w*0.12;
    const lift = Math.sin(t*Math.PI);
    const r  = h*(0.34 + 0.62*lift)*(0.8+rnd()*0.45);
    const py = cy - lift*h*0.34 + (rnd()-0.5)*h*0.14;
    const gr = g.createRadialGradient(px, py-r*0.3, r*0.1, px, py, r);
    gr.addColorStop(0.0, 'rgba(255,255,255,'+alpha+')');
    gr.addColorStop(0.55,'rgba(252,253,255,'+(alpha*0.85)+')');
    gr.addColorStop(1.0, 'rgba('+tint+',0)');
    g.fillStyle = gr;
    g.beginPath(); g.ellipse(px, py, r, r*0.78, 0, 0, 6.2832); g.fill();
  }
  // flat shaded base
  const gb = g.createLinearGradient(0, cy, 0, cy + h*0.42);
  gb.addColorStop(0,'rgba('+tint+','+(alpha*0.5)+')');
  gb.addColorStop(1,'rgba('+tint+',0)');
  g.fillStyle = gb;
  g.beginPath(); g.ellipse(cx, cy+h*0.04, w*0.5, h*0.2, 0, 0, 6.2832); g.fill();
}

function makeSky(night){
  const W = 2048, H = 1024;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  seed(night ? 5150 : 20260729);

  const grd = g.createLinearGradient(0,0,0,H);
  if(!night){
    grd.addColorStop(0.00,'#12459f'); grd.addColorStop(0.16,'#2c6dc6');
    grd.addColorStop(0.33,'#61a0e2'); grd.addColorStop(0.44,'#a8d1f0');
    grd.addColorStop(0.495,'#dceef9'); grd.addColorStop(0.505,'#cadbe6');
    grd.addColorStop(0.60,'#8fa389'); grd.addColorStop(1.00,'#54704a');
  } else {
    grd.addColorStop(0.00,'#03060f'); grd.addColorStop(0.20,'#071026');
    grd.addColorStop(0.38,'#0e1c3c'); grd.addColorStop(0.47,'#1b2f57');
    grd.addColorStop(0.495,'#2c4570'); grd.addColorStop(0.505,'#1a2740');
    grd.addColorStop(0.60,'#101a2b'); grd.addColorStop(1.00,'#080d16');
  }
  g.fillStyle = grd; g.fillRect(0,0,W,H);

  if(night){                                   // stars
    for(let i=0;i<900;i++){
      const x = rnd()*W, y = rnd()*H*0.48, a = 0.15 + rnd()*0.8;
      const r = rnd()<0.06 ? 1.9 : 0.85;
      g.fillStyle = 'rgba(255,253,240,'+(a*(1 - y/(H*0.55)))+')';
      g.beginPath(); g.arc(x,y,r,0,6.2832); g.fill();
    }
  }

  /* sun / moon disc + glow, positioned to match the directional light */
  const [su,sv] = dirToUV(night ? MOONDIR : SUNDIR);
  const sx = su*W, sy = (1-sv)*H;
  const glow = g.createRadialGradient(sx,sy,4, sx,sy, night?170:300);
  if(!night){
    glow.addColorStop(0,'rgba(255,252,236,1)'); glow.addColorStop(0.055,'rgba(255,247,214,0.85)');
    glow.addColorStop(0.20,'rgba(255,238,196,0.20)'); glow.addColorStop(0.50,'rgba(214,232,250,0.07)');
    glow.addColorStop(1,'rgba(190,218,245,0)');
  } else {
    glow.addColorStop(0,'rgba(238,244,255,1)'); glow.addColorStop(0.10,'rgba(214,228,255,0.7)');
    glow.addColorStop(0.35,'rgba(150,180,240,0.16)'); glow.addColorStop(1,'rgba(120,150,220,0)');
  }
  g.fillStyle = glow; g.beginPath(); g.arc(sx,sy,night?175:305,0,6.2832); g.fill();

  /* clouds — denser and flatter towards the horizon */
  const tint = night ? '58,72,104' : '176,196,216';
  const nC = night ? 16 : 46;
  for(let i=0;i<nC;i++){
    const band = rnd();
    const cy = H*(0.16 + band*0.315);
    const scale = 0.35 + (1-band)*1.15;
    cumulus(g, rnd()*W, cy, (150+rnd()*440)*scale, (52+rnd()*120)*scale,
            night ? 0.14+rnd()*0.12 : 0.5+rnd()*0.45, tint);
  }
  /* horizon haze band + distant hill silhouettes */
  const hz = g.createLinearGradient(0,H*0.455,0,H*0.508);
  hz.addColorStop(0, night?'rgba(30,48,84,0)':'rgba(178,208,231,0)');
  hz.addColorStop(1, night?'rgba(38,58,96,0.85)':'rgba(186,214,234,0.62)');
  g.fillStyle = hz; g.fillRect(0,H*0.455,W,H*0.055);
  g.fillStyle = night ? 'rgba(22,34,58,0.85)' : 'rgba(122,155,168,0.62)';
  for(let i=0;i<26;i++){
    const hx = rnd()*W, hw = 130+rnd()*330, hh = 8+rnd()*26;
    g.beginPath(); g.ellipse(hx, H*0.5015, hw, hh, 0, Math.PI, 0); g.fill();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
const SKY = { day:null, night:null, dayEnv:null, nightEnv:null };
function initSky(){
  SKY.day   = makeSky(false);
  SKY.night = makeSky(true);
  SKY.dayEnv   = pmrem.fromEquirectangular(SKY.day).texture;
  SKY.nightEnv = pmrem.fromEquirectangular(SKY.night).texture;
}

/* ══════════════════════════════════════════════════════════════════════════
   4.  LIGHTS
   ══════════════════════════════════════════════════════════════════════════ */
/* Light budget.  scene.environment (the PMREM'd sky) already supplies almost all
   the ambient fill, so hemisphere and ambient are only a whisper on top — stack
   all three at "normal" values and every lit face clips to white.             */
const hemi = new THREE.HemisphereLight(0xcfe6f7, 0x6d8a58, 0.10); scene.add(hemi);
const amb  = new THREE.AmbientLight(0xffffff, 0.0);               scene.add(amb);

const sun = new THREE.DirectionalLight(0xfff3dc, 1.30);
sun.position.copy(SUNDIR).multiplyScalar(150);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
const SD = 74;
Object.assign(sun.shadow.camera, {left:-SD, right:SD, top:SD, bottom:-SD, near:20, far:330});
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0009;
sun.shadow.normalBias = 0.05;
scene.add(sun);

const rim = new THREE.DirectionalLight(0xbfd8ff, 0.10);
rim.position.set(-90, 48, -70); scene.add(rim);
const bounce = new THREE.DirectionalLight(0xdfe8c8, 0.05);
bounce.position.set(10, -40, 20); scene.add(bounce);

/* ══════════════════════════════════════════════════════════════════════════
   5.  SHARED GEOMETRY  (unit primitives, scaled per instance)
   ══════════════════════════════════════════════════════════════════════════ */
function slopeGeo(){
  const A=[-.5,-.5,-.5],Bv=[.5,-.5,-.5],Cv=[.5,.5,-.5],D=[-.5,.5,-.5],
        E=[-.5,-.5,.5],F=[.5,-.5,.5];
  const t = [ A,D,Cv,  A,Cv,Bv,   A,Bv,F,  A,F,E,
              D,E,F,   D,F,Cv,    A,E,D,   Bv,Cv,F ];
  const pos = new Float32Array(t.length*3);
  t.forEach((v,i)=>{ pos[i*3]=v[0]; pos[i*3+1]=v[1]; pos[i*3+2]=v[2]; });
  const gg = new THREE.BufferGeometry();
  gg.setAttribute('position', new THREE.BufferAttribute(pos,3));
  gg.computeVertexNormals();
  return gg;
}
const GEO = {
  box  : new THREE.BoxGeometry(1,1,1),
  cyl  : new THREE.CylinderGeometry(1,1,1,14,1),
  stud : new THREE.CylinderGeometry(1,1,1,9,1),
  cone : new THREE.ConeGeometry(1,1,12,1),
  pyr  : new THREE.ConeGeometry(1,1,4,1),
  sph  : new THREE.SphereGeometry(1,12,8),
  slope: slopeGeo(),
  tube : new THREE.TorusGeometry(1, 0.028, 6, 44),
};

/* ══════════════════════════════════════════════════════════════════════════
   6.  MATERIAL CHANNELS  —  ABS plastic, glass, water, chrome, foliage
   ══════════════════════════════════════════════════════════════════════════ */
function plastic(rough, coat, coatR, envI){
  return new THREE.MeshPhysicalMaterial({
    color:0xffffff, roughness:rough, metalness:0.0,
    clearcoat:coat, clearcoatRoughness:coatR, envMapIntensity:envI,
    reflectivity:0.5
  });
}
/* envMapIntensity is the ambient dial: at 1.0 a bright sky washes the colour
   straight out of the albedo, so opaque plastic sits low and only the shiny
   channels (glazing, water, chrome) are allowed to drink in the sky.        */
const MAT = {
  body  : plastic(0.38, 0.34, 0.24, 0.55),   // moulded ABS brick
  stud  : plastic(0.34, 0.38, 0.20, 0.60),
  glass : plastic(0.06, 0.90, 0.05, 1.25),   // trans panels / curtain walling
  water : plastic(0.035,1.00, 0.02, 1.70),
  chrome: new THREE.MeshPhysicalMaterial({color:0xffffff, roughness:0.14, metalness:0.92, envMapIntensity:1.10}),
  leaf  : plastic(0.58, 0.12, 0.50, 0.40),   // matte-ish foliage
  dyn   : plastic(0.34, 0.38, 0.20, 0.60),   // moving pieces
  dynG  : plastic(0.07, 0.90, 0.06, 1.20),
};
const SHADOWLESS = {stud:1};                  // studs are too small to matter

/* ══════════════════════════════════════════════════════════════════════════
   7.  EMIT BUFFERS
   ══════════════════════════════════════════════════════════════════════════ */
let SB, DB, AGENTS, SPECIAL, TLIGHTS, WINDOWS, NIGHTLAMPS;
function resetBuffers(){
  SB = {}; DB = {}; AGENTS = []; SPECIAL = [];
  TLIGHTS = []; WINDOWS = []; NIGHTLAMPS = [];
}
function em(ch, prim, p, s, c, rot){
  const k = ch+'|'+prim, a = SB[k] || (SB[k] = []);
  a.push({p:p, s:s, c:c, rot:rot});
  return {k:k, i:a.length-1};
}
/* static helpers ---------------------------------------------------------- */
function bx(x,y,z,w,h,d,c,ch){ return em(ch||'body','box',[x,y,z],[w,h,d],c); }
function studs(sx,sz,w,d,y,c,skip){
  for(let i=0;i<w;i++) for(let j=0;j<d;j++){
    if(skip && skip(sx+i, sz+j)) continue;
    em('stud','stud',[wx(sx)+i+0.5, y+SH/2, wx(sz)+j+0.5],[SR,SH,SR],c);
  }
}
/* brick in stud coords: sx,sz = min corner (studs); y = bottom (world) */
function br(sx,sz,w,d,y,h,c,o){
  o = o || {};
  const g = o.gap===undefined ? GAP : o.gap;
  bx(wx(sx)+w/2, y+h/2, wx(sz)+d/2, w-2*g, h, d-2*g, c, o.ch);
  if(o.studs) studs(sx,sz,w,d,y+h,c,o.skip);
}
function cy(x,y,z,r,h,c,rot,ch){ return em(ch||'body','cyl',[x,y,z],[r,h,r],c,rot); }
function cn(x,y,z,r,h,c,ch,rot){ return em(ch||'body','cone',[x,y,z],[r,h,r],c,rot); }
function pyr(x,y,z,r,h,c,rot,ch){ return em(ch||'body','pyr',[x,y,z],[r,h,r],c,rot||[0,Math.PI/4,0]); }
function sp(x,y,z,r,c,ch){ return em(ch||'body','sph',[x,y,z],[r,r,r],c); }
function sl(x,y,z,w,h,d,c,ry,ch){ return em(ch||'body','slope',[x,y,z],[w,h,d],c,[0,ry||0,0]); }
function win(x,y,z,w,h,d,c){ const r = bx(x,y,z,w,h,d,c,'glass'); WINDOWS.push(r); return r; }

/* ══════════════════════════════════════════════════════════════════════════
   8.  THE MAP  —  occupancy grid, Thames, roads, parks
   ══════════════════════════════════════════════════════════════════════════ */
const FREE=0, ROAD=1, WATER=2, PARK=3, MARK=4, QUAY=5, BRIDGE=6;
let G, FOOT;
const gi = (x,z) => z*N + x;
const inB = (x,z) => x>=0 && x<N && z>=0 && z<N;
const gget = (x,z) => inB(x,z) ? G[gi(x,z)] : ROAD;
function paint(x0,z0,w,d,v,onlyOver){
  for(let z=z0;z<z0+d;z++) for(let x=x0;x<x0+w;x++){
    if(!inB(x,z)) continue;
    if(onlyOver !== undefined && G[gi(x,z)] !== onlyOver) continue;
    G[gi(x,z)] = v;
  }
}

/* ── Thames: a snapped staircase meander, 12 studs wide ── */
const snap3 = v => Math.round(v/3)*3;
const RC=[], RTOP=[], RBOT=[];
for(let x=0;x<N;x++){
  const c = snap3(62 - 9*Math.sin(Math.PI*x/N));
  RC[x]=c; RTOP[x]=c-7; RBOT[x]=c+6;
}
/* 3-stud carriageways: two lanes, and they leave room for proper city blocks */
const RW = 3;
const HROADS = [[10,RW],[24,RW],[36,RW],[76,RW],[88,RW]];
const VROADS = [[8,RW],[24,RW],[40,RW],[56,RW],[72,RW],[88,RW]];
const BRIDGEX = [8,40,72,88];
const isBridgeX = x => BRIDGEX.some(b => x>=b && x<b+RW);

/* ── greedy maximal-rectangle merge, keeps the plate count sane ── */
function rectsOf(test){
  const used = new Uint8Array(N*N), out = [];
  for(let z=0;z<N;z++) for(let x=0;x<N;x++){
    const i = gi(x,z);
    if(used[i] || !test(x,z)) continue;
    let w=1;
    while(x+w<N && !used[gi(x+w,z)] && test(x+w,z)) w++;
    let d=1;
    outer: while(z+d<N){
      for(let k=0;k<w;k++){ const j=gi(x+k,z+d); if(used[j] || !test(x+k,z+d)) break outer; }
      d++;
    }
    for(let a=0;a<d;a++) for(let b=0;b<w;b++) used[gi(x+b,z+a)] = 1;
    out.push([x,z,w,d]);
  }
  return out;
}

/* ── landmark plots.  Riverside sites are derived from the actual Thames rows
      so nothing ever ends up standing in the water or on a carriageway.   ── */
function northPlot(x0,w,depth,floorZ){
  let m = 1e9;
  for(let x=x0;x<x0+w;x++) m = Math.min(m, RTOP[x]);
  const dd = Math.max(3, Math.min(depth, m - 1 - (floorZ===undefined ? 39 : floorZ)));
  return [x0, m-1-dd, w, dd];
}
function southPlot(x0,w,depth,ceilZ){
  let m = -1e9;
  for(let x=x0;x<x0+w;x++) m = Math.max(m, RBOT[x]);
  const z0 = m+2;
  return [x0, z0, w, Math.max(3, Math.min(depth, (ceilZ===undefined ? 75 : ceilZ) - z0))];
}
const PLOTS = {
  hyde      : [0,0,24,10],    regents   : [43,0,13,10],
  bt        : [43,13,7,7],    piccadilly: [27,13,8,7],
  buckingham: [11,27,8,9],    stjames   : [19,27,5,9],
  trafalgar : [27,27,8,9],    stpauls   : [43,27,7,9],
  gherkin   : [59,27,6,6],    grater    : [66,27,6,5],
  walkie    : [75,27,6,6],    bishops   : [82,27,6,5],
  abbey     : northPlot(27,6,5),
  parliament: northPlot(34,6,6),
  tower     : northPlot(75,7,7),
  eye       : southPlot(27,8,8),
  shard     : southPlot(59,6,8),
  battersea : southPlot(11,12,8),
  southwark : [91,79,5,17],
};
const PARKPLOTS = {hyde:1, regents:1, stjames:1, southwark:1};
const TOURS = [];   // {name, at:[wx,wy,wz], r, theta, phi}

function buildMap(){
  G = new Uint8Array(N*N); FOOT = new Uint8Array(N*N);
  /* water */
  for(let x=0;x<N;x++) for(let z=RTOP[x]; z<=RBOT[x]; z++) if(inB(x,z)) G[gi(x,z)] = WATER;
  /* two-stud embankment walk along both banks */
  for(let x=0;x<N;x++) for(let k=1;k<=2;k++){
    if(inB(x,RTOP[x]-k)) G[gi(x,RTOP[x]-k)] = QUAY;
    if(inB(x,RBOT[x]+k)) G[gi(x,RBOT[x]+k)] = QUAY;
  }
  /* roads — verticals only cross the river on the four bridge alignments */
  for(const [z0,h] of HROADS) paint(0,z0,N,h,ROAD);
  for(const [x0,w] of VROADS){
    const bridge = isBridgeX(x0);
    for(let x=x0;x<x0+w;x++) for(let z=0;z<N;z++){
      const cur = G[gi(x,z)];
      if(cur===WATER || cur===QUAY){ if(bridge) G[gi(x,z)] = BRIDGE; }
      else G[gi(x,z)] = ROAD;
    }
  }
  /* parks carved by the roads that cross them */
  paint(PLOTS.hyde[0],PLOTS.hyde[1],PLOTS.hyde[2],PLOTS.hyde[3], PARK, FREE);
  paint(PLOTS.regents[0],PLOTS.regents[1],PLOTS.regents[2],PLOTS.regents[3], PARK, FREE);
  paint(PLOTS.stjames[0],PLOTS.stjames[1],PLOTS.stjames[2],PLOTS.stjames[3], PARK, FREE);
  paint(PLOTS.southwark[0],PLOTS.southwark[1],PLOTS.southwark[2],PLOTS.southwark[3], PARK, FREE);
  /* landmark reservations */
  for(const k in PLOTS){
    if(PARKPLOTS[k]) continue;
    const [x,z,w,d] = PLOTS[k];
    paint(x,z,w,d, MARK, FREE);
    paint(x,z,w,d, MARK, PARK);
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   9.  GROUND  —  baseplate, water, roads, quays, pavements, parkland
   ══════════════════════════════════════════════════════════════════════════ */
const GY = PLATE;                 // pavement top
const WY = 0.17;                  // water surface
function buildGround(){
  /* baseplate with a lip of grass around the built area */
  br(-2,-2,N+4,N+4, -PLATE, PLATE, C.brightGreen, {gap:0});

  /* water: one merged sheet + a few lighter ripple plates */
  for(const [x,z,w,d] of rectsOf((x,z)=>G[gi(x,z)]===WATER))
    br(x,z,w,d, 0, WY, C.thames, {gap:0});
  seed(4242);
  for(let i=0;i<70;i++){
    const x = ri(1,N-6), c = RC[x];
    if(rnd()<0.5) continue;
    const z = ri(c-5, c+3), w = ri(2,6);
    if(!inB(x,z) || G[gi(x,z)]!==WATER) continue;
    bx(wx(x)+w/2, WY+0.02, wx(z)+0.5, w-0.3, 0.04, 0.5, C.thamesLit, 'water');
  }
  /* roads (smooth tarmac) */
  for(const [x,z,w,d] of rectsOf((x,z)=>{const v=G[gi(x,z)]; return v===ROAD||v===BRIDGE;}))
    br(x,z,w,d, 0, GY, C.darkBlueGray, {gap:0});
  /* dashed centre lines */
  for(const [z0,h] of HROADS){
    const cz = wx(z0) + h/2;
    for(let x=1;x<N-2;x+=3){
      const v = gget(x, z0+1); if(v!==ROAD && v!==BRIDGE) continue;
      bx(wx(x)+1, GY+0.03, cz, 1.6, 0.06, 0.18, C.white);
    }
  }
  for(const [x0,w] of VROADS){
    const cx = wx(x0) + w/2;
    for(let z=1;z<N-2;z+=3){
      const v = gget(x0+1, z); if(v!==ROAD && v!==BRIDGE) continue;
      bx(cx, GY+0.03, wx(z)+1, 0.18, 0.06, 1.6, C.white);
    }
  }
  /* quays: pale stone with a black railing, broken at the bridges */
  for(const [x,z,w,d] of rectsOf((x,z)=>G[gi(x,z)]===QUAY)){
    br(x,z,w,d, 0, GY, C.stone, {gap:0, studs:true});
  }
  for(let x=0;x<N;x++){
    if(isBridgeX(x)) continue;
    for(const zz of [RTOP[x]-1, RBOT[x]+1]){
      if(!inB(x,zz) || G[gi(x,zz)]!==QUAY) continue;
      const side = (zz < RC[x]) ? 0.46 : -0.46;
      bx(wx(x)+0.5, GY+0.5, wx(zz)+0.5+side, 1.0, 0.10, 0.09, C.black);
      if(x%2===0) bx(wx(x)+0.5, GY+0.28, wx(zz)+0.5+side, 0.10, 0.56, 0.10, C.black);
    }
  }
  /* parkland */
  for(const [x,z,w,d] of rectsOf((x,z)=>G[gi(x,z)]===PARK))
    br(x,z,w,d, 0, GY, C.brightGreen, {gap:0, studs:true, skip:(a,b)=>FOOT[gi(a,b)]});
  /* pavements everywhere else */
  for(const [x,z,w,d] of rectsOf((x,z)=>G[gi(x,z)]===FREE))
    br(x,z,w,d, 0, GY, C.blueGray, {gap:0, studs:true, skip:(a,b)=>FOOT[gi(a,b)]});
}

/* ══════════════════════════════════════════════════════════════════════════
   10.  BUILDING KITS
   ══════════════════════════════════════════════════════════════════════════ */
function mark(x0,z0,w,d){
  for(let z=z0;z<z0+d;z++) for(let x=x0;x<x0+w;x++) if(inB(x,z)) FOOT[gi(x,z)] = 1;
}
/* continuous curtain-wall band — right for towers, wrong for anything Georgian */
function glazing(x0,z0,w,d,y,h,c,faces){
  const X = wx(x0), Z = wx(z0), t = 0.17, yy = y + h*0.5;
  if(w>=3){
    if(!faces||faces.n) win(X+w/2, yy, Z+GAP,     w-1.3, h*0.52, t, c);
    if(!faces||faces.s) win(X+w/2, yy, Z+d-GAP,   w-1.3, h*0.52, t, c);
  }
  if(d>=3){
    if(!faces||faces.w) win(X+GAP,   yy, Z+d/2,   t, h*0.52, d-1.3, c);
    if(!faces||faces.e) win(X+w-GAP, yy, Z+d/2,   t, h*0.52, d-1.3, c);
  }
}
/* individually punched sash windows — the London look */
function punched(x0,z0,w,d,y,h,c,faces,tall){
  const X = wx(x0), Z = wx(z0), t = 0.16;
  const yy = y + h*(tall ? 0.50 : 0.54), ww = 0.78, hh = h*(tall ? 0.70 : 0.50);
  const cols = (n)=>{
    const out = [];
    if(n < 3){ out.push(n/2); return out; }
    for(let i=1;i<=n-2;i+=2) out.push(i+0.5);
    if(out.length === 0) out.push(n/2);
    return out;
  };
  if(w>=2){
    for(const u of cols(w)){
      if(!faces||faces.n) win(X+u, yy, Z+GAP,   ww, hh, t, c);
      if(!faces||faces.s) win(X+u, yy, Z+d-GAP, ww, hh, t, c);
    }
  }
  if(d>=2){
    for(const v of cols(d)){
      if(!faces||faces.w) win(X+GAP,   yy, Z+v, t, hh, ww, c);
      if(!faces||faces.e) win(X+w-GAP, yy, Z+v, t, hh, ww, c);
    }
  }
}
/* Georgian terrace: narrow houses sharing party walls, gable roof, chimneys */
function terrace(x0,z0,w,d,y){
  mark(x0,z0,w,d);
  const alongX = w >= d;
  const len = alongX ? w : d, dep = alongX ? d : w;
  const storeys = ri(3,4);
  const roofC = pick([C.slate, C.lead, C.darkBlueGray, C.brickDark]);
  let o = 0;
  while(o < len){
    let hw = Math.min(ri(2,3), len-o);
    if(len-o-hw === 1) hw += 1;
    const hx = alongX ? x0+o : x0, hz = alongX ? z0 : z0+o;
    const hwx = alongX ? hw : dep, hwz = alongX ? dep : hw;
    const bodyC = pick(TERRACE);
    let top = y;
    for(let s=0;s<storeys;s++){
      br(hx,hz,hwx,hwz, top, BRICK, bodyC);
      const front = alongX ? {s:1} : {e:1};
      if(s===0){
        // door + fanlight on the street face
        const dx = alongX ? wx(hx)+hwx/2 : wx(hx)+hwx-GAP;
        const dz = alongX ? wx(hz)+hwz-GAP : wx(hz)+hwz/2;
        bx(dx, top+BRICK*0.44, dz, alongX?0.85:0.18, BRICK*0.8, alongX?0.18:0.85, pick(DOORC));
        punched(hx,hz,hwx,hwz, top, BRICK, C.glass, front);
      } else {
        punched(hx,hz,hwx,hwz, top, BRICK, C.glass, front);
        // white sash surrounds
        const tc = pick(TRIM);
        if(alongX) bx(wx(hx)+hwx/2, top+BRICK*0.93, wx(hz)+hwz-GAP, hwx-1.0, 0.13, 0.2, tc);
        else       bx(wx(hx)+hwx-GAP, top+BRICK*0.93, wx(hz)+hwz/2, 0.2, 0.13, hwz-1.0, tc);
      }
      top += BRICK;
    }
    // parapet / cornice
    br(hx,hz,hwx,hwz, top, PLATE, pick(TRIM), {gap:0.0});
    top += PLATE;
    // gable roof from two slopes
    const rh = 0.95;
    if(alongX){
      const half = hwz/2;
      sl(wx(hx)+hwx/2, top+rh/2, wx(hz)+hwz-half/2, hwx-0.05, rh, half, roofC, 0);
      sl(wx(hx)+hwx/2, top+rh/2, wx(hz)+half/2,     hwx-0.05, rh, half, roofC, Math.PI);
    } else {
      const half = hwx/2;
      sl(wx(hx)+hwx-half/2, top+rh/2, wx(hz)+hwz/2, half, rh, hwz-0.05, roofC, -Math.PI/2);
      sl(wx(hx)+half/2,     top+rh/2, wx(hz)+hwz/2, half, rh, hwz-0.05, roofC, Math.PI/2);
    }
    // chimney stack on the party wall
    if(o+hw < len || chance(0.6)){
      const cxp = alongX ? wx(hx)+hwx-0.25 : wx(hx)+hwx/2;
      const czp = alongX ? wx(hz)+hwz/2    : wx(hz)+hwz-0.25;
      bx(cxp, top+rh*0.55+0.5, czp, 0.55, 1.5, 0.55, C.brickDark);
      for(const dd of [-0.14,0.14])
        cy(cxp+(alongX?0:dd), top+rh*0.55+1.32, czp+(alongX?dd:0), 0.11, 0.34, C.stone);
    }
    o += hw;
  }
}
/* Portland-stone mansion block / civic office */
function mansion(x0,z0,w,d,y,minL,maxL){
  mark(x0,z0,w,d);
  const layers = ri(minL||4, maxL||7);
  const bodyC = pick(OFFICE);
  const trimC = pick(TRIM);
  const glassC = chance(0.5) ? C.glass : C.lightBlue;
  let top = y;
  // rusticated ground floor
  br(x0,z0,w,d, top, BRICK, pick([C.stone,C.darkTan,C.lightGray]));
  punched(x0,z0,w,d, top, BRICK, glassC, null, true);
  bx(wx(x0)+w/2, top+BRICK*0.42, wx(z0)+d-GAP, 1.1, BRICK*0.78, 0.2, pick(DOORC));
  top += BRICK;
  bx(wx(x0)+w/2, top+0.07, wx(z0)+d/2, w+0.10, 0.14, d+0.10, trimC);   // string course
  top += 0.14;
  for(let L=1;L<layers;L++){
    br(x0,z0,w,d, top, BRICK, bodyC);
    punched(x0,z0,w,d, top, BRICK, glassC);
    if(L%3===0){ top+=BRICK; bx(wx(x0)+w/2, top+0.07, wx(z0)+d/2, w+0.08, 0.14, d+0.08, trimC); top+=0.14; }
    else top += BRICK;
  }
  // cornice, mansard, dormers
  bx(wx(x0)+w/2, top+0.11, wx(z0)+d/2, w+0.24, 0.22, d+0.24, trimC);
  top += 0.22;
  const roofC = pick([C.slate, C.lead, C.darkBlueGray]);
  const inset = 0.9;
  sl(wx(x0)+w/2, top+0.55, wx(z0)+d-inset/2, w-0.1, 1.1, inset, roofC, 0);
  sl(wx(x0)+w/2, top+0.55, wx(z0)+inset/2,   w-0.1, 1.1, inset, roofC, Math.PI);
  sl(wx(x0)+w-inset/2, top+0.55, wx(z0)+d/2, inset, 1.1, d-0.1, roofC, -Math.PI/2);
  sl(wx(x0)+inset/2,   top+0.55, wx(z0)+d/2, inset, 1.1, d-0.1, roofC, Math.PI/2);
  if(w>2 && d>2) br(x0+1,z0+1,w-2,d-2, top+1.1, PLATE, roofC, {gap:0, studs:true});
  for(let i=0;i<Math.max(1,Math.floor(w/3));i++){
    const dx = wx(x0) + 1.2 + i*2.4;
    if(dx > wx(x0)+w-1) break;
    bx(dx, top+0.62, wx(z0)+d-inset*0.72, 0.8, 0.7, 0.5, roofC);
    win(dx, top+0.62, wx(z0)+d-inset*0.72-0.24, 0.55, 0.42, 0.12, C.glass);
  }
  if(chance(0.4)){
    const cxp = wx(x0)+1.0, czp = wx(z0)+1.0;
    bx(cxp, top+1.6, czp, 0.6, 1.8, 0.6, C.stone);
  }
}
/* modern curtain-wall tower (the City / Southbank) */
function glassTower(x0,z0,w,d,y,minL,maxL){
  mark(x0,z0,w,d);
  const layers = ri(minL||8, maxL||18);
  const frameC = pick([C.lightGray, C.white, C.darkBlueGray, C.blueGray]);
  const gC = pick([C.glass, C.glassDark, C.glassGreen, C.azure]);
  let top = y, cw=w, cd=d, cx=x0, cz=z0;
  // podium
  br(cx,cz,cw,cd, top, BRICK*1.2, frameC); glazing(cx,cz,cw,cd, top, BRICK*1.2, gC); top += BRICK*1.2;
  const setbackAt = layers>11 ? Math.floor(layers*0.6) : -1;
  for(let L=1;L<layers;L++){
    if(L===setbackAt && cw>3 && cd>3){
      br(cx,cz,cw,cd, top, PLATE, frameC); top += PLATE;
      cx+=1; cz+=1; cw-=2; cd-=2;
    }
    br(cx,cz,cw,cd, top, BRICK*0.28, frameC);              // spandrel
    top += BRICK*0.28;
    bx(wx(cx)+cw/2, top+BRICK*0.46, wx(cz)+cd/2, cw+0.02, BRICK*0.92, cd+0.02, gC, 'glass');
    top += BRICK*0.92;
  }
  br(cx,cz,cw,cd, top, PLATE, frameC, {gap:0.0, studs:true}); top += PLATE;
  // plant room + mast
  if(cw>2 && cd>2){ br(cx+1,cz+1,cw-2,cd-2, top, PLATE*2, C.lightGray, {studs:true}); top += PLATE*2; }
  const mx = wx(cx)+cw/2, mz = wx(cz)+cd/2;
  cy(mx, top+2.0, mz, 0.10, 4.0, C.lightGray, null, 'chrome');
  sp(mx, top+4.1, mz, 0.20, C.busRed);
  NIGHTLAMPS.push([mx, top+4.1, mz, 0xff3b30, 0.6]);
}
/* corner pub with hanging sign */
function pub(x0,z0,w,d,y){
  mark(x0,z0,w,d);
  const base = pick([0x123D2A, 0x5C1010, 0x1B3A5C, C.brickDark]);
  br(x0,z0,w,d, y, BRICK, base);
  punched(x0,z0,w,d, y, BRICK, C.gold, null, true);
  bx(wx(x0)+w/2, y+BRICK+0.09, wx(z0)+d/2, w+0.16, 0.18, d+0.16, C.gold);
  let top = y+BRICK+0.18;
  const upper = pick([C.portland, C.brick, C.stone]);
  for(let s=0;s<2;s++){ br(x0,z0,w,d, top, BRICK, upper); punched(x0,z0,w,d, top, BRICK, C.glass); top += BRICK; }
  br(x0,z0,w,d, top, PLATE, C.slate, {gap:0.0}); top += PLATE;
  sl(wx(x0)+w/2, top+0.45, wx(z0)+d-d/4, w-0.05, 0.9, d/2, C.slate, 0);
  sl(wx(x0)+w/2, top+0.45, wx(z0)+d/4,   w-0.05, 0.9, d/2, C.slate, Math.PI);
  // swinging sign
  bx(wx(x0)+w/2, y+BRICK*1.9, wx(z0)+d+0.34, 0.09, 0.09, 0.68, C.black);
  bx(wx(x0)+w/2, y+BRICK*1.55, wx(z0)+d+0.62, 0.9, 0.62, 0.09, pick([C.gold,C.busRed,C.darkGreen]));
}
/* small parish church with a spire */
function church(x0,z0,w,d,y){
  mark(x0,z0,w,d);
  const s = C.stone;
  br(x0,z0,w,d, y, BRICK*2.4, s);
  punched(x0,z0,w,d, y, BRICK*2.4, C.glass, null, true);
  br(x0,z0,w,d, y+BRICK*2.4, PLATE, C.lead, {gap:0.0});
  const tw = Math.min(2, w-1), tx = x0, tz = z0;
  br(tx,tz,tw,tw, y, BRICK*5.4, s);
  br(tx,tz,tw,tw, y+BRICK*5.4, PLATE, C.stone, {gap:0.0});
  for(const [ox,oz] of [[0,0],[tw-0.4,0],[0,tw-0.4],[tw-0.4,tw-0.4]])
    cn(wx(tx)+ox+0.2, y+BRICK*5.4+0.75, wx(tz)+oz+0.2, 0.16, 1.1, s);
  pyr(wx(tx)+tw/2, y+BRICK*5.4+1.9, wx(tz)+tw/2, tw*0.62, 3.0, C.lead);
  cy(wx(tx)+tw/2, y+BRICK*5.4+3.7, wx(tz)+tw/2, 0.05, 0.7, C.gold);
  // nave roof
  const rh = 1.0, ax = w>=d;
  if(ax){
    sl(wx(x0)+w/2, y+BRICK*2.4+PLATE+rh/2, wx(z0)+d*0.75, w-0.05, rh, d/2, C.lead, 0);
    sl(wx(x0)+w/2, y+BRICK*2.4+PLATE+rh/2, wx(z0)+d*0.25, w-0.05, rh, d/2, C.lead, Math.PI);
  }
}
/* leftover plot: garden square, plane trees, kiosk */
function square(x0,z0,w,d,y){
  br(x0,z0,w,d, y, PLATE*0.6, C.brightGreen, {gap:0.0});
  mark(x0,z0,w,d);
  const nT = Math.max(1, Math.floor(w*d/7));
  for(let i=0;i<nT;i++) planeTree(x0+ri(0,w-1)+0.5, z0+ri(0,d-1)+0.5, y+PLATE*0.6, 0.8+rnd()*0.5);
  if(w>=3 && d>=3 && chance(0.5)) bench(wx(x0)+w/2, y+PLATE*0.6, wx(z0)+d-0.8, 0);
}

/* ── street & park furniture ─────────────────────────────────────────────── */
function planeTree(sx,sz,y,scale){
  const x = wx(sx), z = wx(sz), k = scale||1;
  cy(x, y+0.95*k, z, 0.24*k, 1.9*k, C.redBrown);
  const g = pick([C.green, C.brightGreen, C.darkGreen]);
  sp(x, y+2.35*k, z, 1.02*k, g, 'leaf');
  sp(x-0.62*k, y+1.95*k, z+0.3*k, 0.66*k, g, 'leaf');
  sp(x+0.55*k, y+2.05*k, z-0.35*k, 0.6*k, g, 'leaf');
  sp(x+0.1*k, y+3.0*k, z+0.1*k, 0.62*k, g, 'leaf');
}
function conifer(sx,sz,y){
  const x = wx(sx), z = wx(sz);
  cy(x, y+0.7, z, 0.2, 1.4, C.redBrown);
  const g = pick([C.green,C.darkGreen]);
  cn(x, y+2.0, z, 1.0, 1.9, g, 'leaf');
  cn(x, y+3.1, z, 0.72, 1.5, g, 'leaf');
}
function bench(x,y,z,ry){
  const a = ry ? 1 : 0;
  bx(x, y+0.4, z, a?0.7:1.8, PLATE, a?1.8:0.7, C.redBrown);
  bx(x + (a?0.28:0), y+0.72, z + (a?0:0.28), a?0.16:1.8, 0.58, a?1.8:0.16, C.redBrown);
  for(const s of [-0.6,0.6]) bx(x+(a?0:s), y+0.22, z+(a?s:0), 0.14, 0.42, 0.14, C.black);
}
function lampPost(x,y,z){
  cy(x, y+2.1, z, 0.095, 4.2, C.darkGreen);

function railings(sx,sz,w,d,y,vert){

    bx(X+w/2, y+0.52, Z+0.5, w, 0.09, 0.08, C.black);

    bx(X+0.5, y+0.52, Z+d/2, 0.08, 0.09, d, C.black);

function trafficSignal(x,y,z,face){

/* ══════════════════════════════════════════════════════════════════════════
   11.  ONE-OFF MESHES  (things that must rotate on their own)
   ══════════════════════════════════════════════════════════════════════════ */
const MATCACHE = {};
function matFor(c, ch){
  const k = (ch||'body')+'_'+c;
  if(!MATCACHE[k]){ const m = MAT[ch||'body'].clone(); m.color.setHex(c); MATCACHE[k] = m; }
  return MATCACHE[k];
}
function meshOf(geo, c, ch){
  const m = new THREE.Mesh(geo, matFor(c, ch));
  m.castShadow = true; m.receiveShadow = true; return m;
}

/* ── Elizabeth Tower + Houses of Parliament ─────────────────────────────── */
function buildParliament(){
  const [px,pz,pw,pd] = PLOTS.parliament;
  const S = C.sand, T = C.darkTan;
  mark(px,pz,pw,pd);
  br(px,pz,pw,pd, 0, PLATE, C.stone, {gap:0});
  const y0 = PLATE;
  // long perpendicular-gothic range
  const mw = pw, md = 6;
  for(let L=0;L<4;L++){
    br(px,pz,mw,md, y0+L*BRICK, BRICK, L%2 ? T : S);
    punched(px,pz,mw,md, y0+L*BRICK, BRICK, C.glass, null, true);
  }
  let top = y0 + 4*BRICK;
  br(px,pz,mw,md, top, PLATE, C.lead, {gap:0}); top += PLATE;
  // pinnacles + roof crest
  for(let i=0;i<mw;i++) if(i%2===0){
    cn(wx(px)+i+0.5, top+0.7, wx(pz)+0.4, 0.17, 1.3, S);
    cn(wx(px)+i+0.5, top+0.7, wx(pz)+md-0.4, 0.17, 1.3, S);
  }
  bx(wx(px)+mw/2, top+0.45, wx(pz)+md/2, mw-0.4, 0.9, 0.5, C.lead);
  // Victoria Tower (west end)
  const vx = px, vz = pz;
  for(let L=0;L<9;L++) br(vx,vz,3,3, y0+L*BRICK, BRICK, L%3===2 ? T : S);
  let vt = y0 + 9*BRICK;
  br(vx,vz,3,3, vt, PLATE, S, {gap:0}); vt += PLATE;
  for(const [ox,oz] of [[0.35,0.35],[2.65,0.35],[0.35,2.65],[2.65,2.65]])
    cn(wx(vx)+ox, vt+0.85, wx(vz)+oz, 0.2, 1.6, S);
  pyr(wx(vx)+1.5, vt+1.5, wx(vz)+1.5, 1.5, 2.6, C.lead);
  cy(wx(vx)+1.5, vt+3.2, wx(vz)+1.5, 0.05, 1.4, C.lightGray, null, 'chrome');
  bx(wx(vx)+1.9, vt+3.55, wx(vz)+1.5, 0.85, 0.5, 0.06, C.busRed);
  // ── Elizabeth Tower / Big Ben ──
  const bxs = px+3, bzs = pz+6, bw = 3;
  const BX0 = wx(bxs), BZ0 = wx(bzs);
  for(let L=0;L<15;L++){
    br(bxs,bzs,bw,bw, y0+L*BRICK, BRICK, L%4===3 ? T : S);
    if(L>1 && L%2===0) punched(bxs,bzs,bw,bw, y0+L*BRICK, BRICK, C.glassDark, null, true);
  }
  let bt = y0 + 15*BRICK;
  bx(BX0+1.5, bt+0.11, BZ0+1.5, bw+0.28, 0.22, bw+0.28, S); bt += 0.22;
  // clock stage: four white dials with gold surrounds + moving hands
  const CS = 2.0;
  br(bxs,bzs,bw,bw, bt, CS, S);
  const cyy = bt + CS/2;
  const faces = [[0, 0, 1.53],[Math.PI, 0, -1.53],[Math.PI/2, 1.53, 0],[-Math.PI/2, -1.53, 0]];
  for(const [ry, ox, oz] of faces){
    cy(BX0+1.5+ox*0.99, cyy, BZ0+1.5+oz*0.99, 0.68, 0.10, C.white,
       Math.abs(ox)>0.1 ? [0,0,Math.PI/2] : [Math.PI/2,0,0]);
    cy(BX0+1.5+ox, cyy, BZ0+1.5+oz, 0.76, 0.06, C.gold,
       Math.abs(ox)>0.1 ? [0,0,Math.PI/2] : [Math.PI/2,0,0]);
    const fg = new THREE.Group();
    fg.position.set(BX0+1.5+ox*1.06, cyy, BZ0+1.5+oz*1.06);
    fg.rotation.y = ry;
    const hg = new THREE.Group(); fg.add(hg);
    const hh = meshOf(new THREE.BoxGeometry(0.055,0.5,0.05), C.black); hh.position.y = 0.19; hg.add(hh);
    const mg = new THREE.Group(); fg.add(mg);
    const mh = meshOf(new THREE.BoxGeometry(0.05,0.68,0.05), C.black); mh.position.y = 0.28; mg.add(mh);
    SPECIAL.push({kind:'clock', hour:hg, min:mg});
    LG.add(fg);
  }
  bt += CS;
  // belfry + spire
  bx(BX0+1.5, bt+0.11, BZ0+1.5, bw+0.30, 0.22, bw+0.30, T); bt += 0.22;
  for(let L=0;L<2;L++){
    br(bxs,bzs,bw,bw, bt+L*BRICK, BRICK, S);
    punched(bxs,bzs,bw,bw, bt+L*BRICK, BRICK, C.glassDark, null, true);
  }
  bt += 2*BRICK;
  for(const [ox,oz] of [[0.4,0.4],[2.6,0.4],[0.4,2.6],[2.6,2.6]])
    cn(BX0+ox, bt+0.9, BZ0+oz, 0.2, 1.7, S);
  pyr(BX0+1.5, bt+1.75, BZ0+1.5, 1.6, 3.3, C.lead);
  cy(BX0+1.5, bt+3.7, BZ0+1.5, 0.055, 1.2, C.gold);
  sp(BX0+1.5, bt+4.35, BZ0+1.5, 0.16, C.gold);
  NIGHTLAMPS.push([BX0+1.5, cyy, BZ0+3.0, 0xfff0c0, 1.5]);
  tour('Big Ben', BX0+1.5, 12, BZ0+1.5, 34, 0.55, 1.15);
}

/* ── London Eye: overhangs the river, capsules stay level ───────────────── */
function buildEye(){
  const [ex,ez,ew,ed] = PLOTS.eye;
  mark(ex,ez,ew,ed);
  br(ex,ez,ew,ed, 0, PLATE, C.stone, {gap:0, studs:true});
  const hubX = wx(ex+ew/2), hubZ = wx(ez+4.0), hubY = 9.6, R = 8.0;
  // A-frame legs anchored on the south bank
  for(const s of [-1.5, 1.5]){
    const lx = hubX + s;
    for(const dz of [2.6, 4.8]){
      const az = hubZ + dz, ay = PLATE;
      const dy = hubY - ay, dz2 = hubZ - az;
      const len = Math.hypot(dy, dz2);
      const leg = meshOf(new THREE.CylinderGeometry(0.17, 0.22, len, 8), C.white);
      leg.position.set(lx, (hubY+ay)/2, (hubZ+az)/2);
      leg.rotation.x = Math.atan2(-dz2, dy);
      LG.add(leg);
    }
  }
  // stay cables back to the anchor block
  for(const s of [-1.5, 1.5]){
    const az = hubZ + 7.4, dy = hubY - PLATE - 0.4, dz2 = hubZ - az;
    const len = Math.hypot(dy, dz2);
    const cb = meshOf(new THREE.CylinderGeometry(0.055,0.055,len,5), C.lightGray, 'chrome');
    cb.position.set(hubX + s, (hubY+PLATE+0.4)/2, (hubZ+az)/2);
    cb.rotation.x = Math.atan2(-dz2, dy);
    LG.add(cb);
  }
  bx(hubX, PLATE+0.5, hubZ+3.6, 4.6, 1.0, 3.0, C.white);
  // rotating wheel: rim, spokes, hub
  const wheel = new THREE.Group();
  wheel.position.set(hubX, hubY, hubZ);
  const rim = meshOf(new THREE.TorusGeometry(R, 0.16, 7, 64), C.white);
  rim.rotation.y = Math.PI/2; wheel.add(rim);
  const rim2 = meshOf(new THREE.TorusGeometry(R*0.965, 0.09, 6, 56), C.lightGray);
  rim2.rotation.y = Math.PI/2; wheel.add(rim2);
  for(let i=0;i<32;i++){
    const a = i*Math.PI*2/32;
    const sk = meshOf(new THREE.CylinderGeometry(0.035,0.035,R,4), C.white);
    sk.position.set(0, Math.sin(a)*R/2, Math.cos(a)*R/2);
    sk.rotation.x = Math.PI/2 - a;
    wheel.add(sk);
  }
  const hub = meshOf(new THREE.CylinderGeometry(0.62,0.62,2.6,12), C.lightGray);
  hub.rotation.z = Math.PI/2; wheel.add(hub);
  LG.add(wheel);
  // level capsules
  const pods = [], podBody = new THREE.SphereGeometry(0.34,10,8),
        podRing = new THREE.TorusGeometry(0.38, 0.05, 5, 16);
  for(let i=0;i<24;i++){
    const g = new THREE.Group();
    const body = meshOf(podBody, C.glass, 'glass');
    body.scale.set(1.0, 0.78, 1.5); g.add(body);
    const ring = meshOf(podRing, C.white);
    ring.rotation.y = Math.PI/2; g.add(ring);
    LG.add(g); pods.push(g);
  }
  SPECIAL.push({kind:'eye', wheel:wheel, pods:pods, hub:new THREE.Vector3(hubX,hubY,hubZ), R:R});
  tour('London Eye', hubX, 10, hubZ, 32, -0.3, 1.15);
}

/* ── Tower Bridge ───────────────────────────────────────────────────────── */
function buildTowerBridge(){
  const bxs = 88, bw = RW, tw = 5;                 // towers are wider than the deck
  const tx = bxs - 1;
  const zt = RTOP[bxs+1], zb = RBOT[bxs+1];
  const X = wx(bxs), TX = wx(tx);
  const tzs = [zt+1, zb-4];
  const deckY = GY;
  let towerTop = 0;
  for(const tz of tzs){
    br(tx-1, tz-1, tw+2, 6, 0, deckY+0.22, C.stone, {gap:0});      // river pier
    for(let L=0;L<8;L++) br(tx, tz, tw, 4, deckY+0.22+L*BRICK, BRICK, L%3===2 ? C.lightGray : C.stone);
    let t = deckY+0.22+8*BRICK;
    glazing(tx, tz, tw, 4, deckY+0.22+3*BRICK, BRICK*3, C.glassDark);
    bx(TX+tw/2, t+0.12, wx(tz)+2, tw+0.34, 0.24, 4.34, C.lightGray); t += 0.24;
    for(let L=0;L<3;L++) br(tx, tz, tw, 4, t+L*BRICK, BRICK, C.stone);
    t += 3*BRICK;
    for(const [ox,oz] of [[0.5,0.5],[tw-0.5,0.5],[0.5,3.5],[tw-0.5,3.5]]){
      cy(TX+ox, t+0.55, wx(tz)+oz, 0.3, 1.1, C.stone);
      cn(TX+ox, t+1.85, wx(tz)+oz, 0.36, 1.6, C.lead);
    }
    pyr(TX+tw/2, t+2.0, wx(tz)+2, 2.4, 3.6, C.lead);
    cy(TX+tw/2, t+4.1, wx(tz)+2, 0.05, 1.0, C.gold);
    towerTop = t;
    NIGHTLAMPS.push([TX+tw/2, t+1.0, wx(tz)+2, 0xbfe0ff, 0.95]);
  }
  // bascule deck between the towers, plus the shore approaches
  br(bxs, zt-2, bw, (zb+3)-(zt-2), deckY, PLATE*0.6, C.darkBlueGray, {gap:0});
  // twin high-level walkways
  const wz0 = tzs[0]+4, wz1 = tzs[1];
  for(const yy of [towerTop-1.1, towerTop+0.15]){
    br(tx+1, wz0, tw-2, wz1-wz0, yy, PLATE, C.medBlue, {gap:0.12});
    for(let z=wz0;z<wz1;z++) if(z%2===0){
      bx(TX+1.15, yy+0.42, wx(z)+0.5, 0.11, 0.84, 0.11, C.medBlue);
      bx(TX+tw-1.15, yy+0.42, wx(z)+0.5, 0.11, 0.84, 0.11, C.medBlue);
    }
  }
  // suspension chains from each tower down to a shore anchor
  const chainTop = towerTop - 2.2, anchorY = deckY + 1.5;
  for(const [tzc, az] of [[tzs[0], zt-3], [tzs[1]+4, zb+4]]){
    const zA = wx(az), zT = wx(tzc);
    const dz = zA - zT, dy = anchorY - chainTop;
    const len = Math.hypot(dz, dy);
    for(const ox of [0.55, bw-0.55]){
      const r = bx(X+ox, (chainTop+anchorY)/2, (zT+zA)/2, 0.17, len, 0.17, C.medBlue);
      SB[r.k][r.i].rot = [Math.atan2(dz, dy), 0, 0];
    }
    for(let k=1;k<4;k++){
      const f = k/4;
      const hz = zT + dz*f, hy = chainTop + dy*f;
      for(const ox of [0.55, bw-0.55]) bx(X+ox, (hy+deckY+0.4)/2, hz, 0.09, hy-deckY-0.4, 0.09, C.medBlue);
    }
  }
  tour('Tower Bridge', X+bw/2, 9, wx((zt+zb)/2), 36, -1.05, 1.14);
}

/* ── St Paul's Cathedral ────────────────────────────────────────────────── */
function buildStPauls(){
  const [px,pz,pw,pd] = PLOTS.stpauls;
  mark(px,pz,pw,pd);
  br(px,pz,pw,pd, 0, PLATE, C.stone, {gap:0, studs:true});
  const y0 = PLATE, P = C.portland;
  // nave + transepts
  for(let L=0;L<3;L++){
    br(px+1, pz+4, pw-2, pd-4, y0+L*BRICK, BRICK, P);
    punched(px+1, pz+4, pw-2, pd-4, y0+L*BRICK, BRICK, C.glassDark, null, true);
  }
  br(px+1, pz+4, pw-2, pd-4, y0+3*BRICK, PLATE, C.lead, {gap:0});
  for(let L=0;L<3;L++) br(px, pz+5, pw, 3, y0+L*BRICK, BRICK, P);
  br(px, pz+5, pw, 3, y0+3*BRICK, PLATE, C.lead, {gap:0});
  // west front with columns and twin towers
  const wf = y0;
  for(let i=0;i<pw;i++) if(i%2===1) cy(wx(px)+i+0.5, wf+1.3, wx(pz)+pd-0.4, 0.22, 2.6, P);
  bx(wx(px)+pw/2, wf+2.85, wx(pz)+pd-0.5, pw-0.2, 0.5, 1.0, P);
  for(const ox of [0.9, pw-0.9]){
    for(let L=0;L<4;L++) cy(wx(px)+ox, wf+0.6+L*1.2, wx(pz)+pd-1.0, 0.62-L*0.05, 1.2, P);
    cn(wx(px)+ox, wf+5.5, wx(pz)+pd-1.0, 0.62, 1.5, C.lead);
    cy(wx(px)+ox, wf+6.5, wx(pz)+pd-1.0, 0.05, 0.7, C.gold);
  }
  // dome: drum, colonnade, dome, lantern
  const dx = wx(px)+pw/2, dz = wx(pz)+2.2, dy = y0+3*BRICK+PLATE;
  cy(dx, dy+1.2, dz, 2.5, 2.4, P);
  for(let i=0;i<20;i++){
    const a = i*Math.PI*2/20;
    cy(dx+Math.cos(a)*2.62, dy+1.2, dz+Math.sin(a)*2.62, 0.13, 2.3, P);
  }
  cy(dx, dy+2.55, dz, 2.72, 0.3, P);
  const dome = sp(dx, dy+2.7, dz, 2.35, C.lead);
  SB['body|sph'][dome.i].s = [2.35, 2.05, 2.35];
  cy(dx, dy+4.75, dz, 0.62, 0.7, P);
  cy(dx, dy+5.35, dz, 0.5, 0.6, C.gold);
  sp(dx, dy+5.85, dz, 0.4, C.gold);
  cy(dx, dy+6.4, dz, 0.05, 0.8, C.gold);
  bx(dx, dy+6.75, dz, 0.4, 0.07, 0.07, C.gold);
  NIGHTLAMPS.push([dx, dy+1.0, dz+3.2, 0xffeec0, 1.4]);
  tour("St Paul's", dx, 8, dz, 30, 0.9, 1.18);
}

/* ── The Gherkin (30 St Mary Axe) ───────────────────────────────────────── */
function buildGherkin(){
  const [px,pz,pw,pd] = PLOTS.gherkin;
  mark(px,pz,pw,pd);
  br(px,pz,pw,pd, 0, PLATE, C.stone, {gap:0, studs:true});
  const cx = wx(px)+pw/2, cz = wx(pz)+pd/2;
  const SEG = 17, H = 21;
  for(let i=0;i<SEG;i++){
    const t = i/(SEG-1);
    const r = 2.55*Math.pow(Math.sin(Math.PI*(0.17 + 0.72*t)), 0.5);
    const y = PLATE + t*H;
    cy(cx, y + H/(SEG-1)/2, cz, r, H/(SEG-1)*0.99, i%2 ? C.glassGreen : C.glassDark, null, 'glass');
    cy(cx, y, cz, r*1.015, 0.08, C.lightGray);
  }
  cy(cx, PLATE+H+0.35, cz, 0.85, 0.7, C.glass, null, 'glass');
  sp(cx, PLATE+H+0.95, cz, 0.6, C.glass, 'glass');
  tour('The Gherkin', cx, 11, cz, 26, 1.6, 1.13);
}

/* ── 20 Fenchurch (Walkie-Talkie), Leadenhall (Cheesegrater), 22 Bishopsgate ─ */
function buildCityCluster(){
  let p = PLOTS.walkie; mark(p[0],p[1],p[2],p[3]);
  br(p[0],p[1],p[2],p[3], 0, PLATE, C.stone, {gap:0, studs:true});
  for(let L=0;L<15;L++){
    const t = L/14, w = 3.2 + t*2.6, d = 3.0 + t*2.4;
    const x = wx(p[0])+p[2]/2, z = wx(p[1])+p[3]/2;
    bx(x, PLATE+L*BRICK+BRICK*0.14, z, w, BRICK*0.28, d, C.lightGray);
    bx(x, PLATE+L*BRICK+BRICK*0.64, z, w+0.02, BRICK*0.9, d+0.02, C.glass, 'glass');
  }
  bx(wx(p[0])+p[2]/2, PLATE+15*BRICK+0.4, wx(p[1])+p[3]/2, 5.6, 0.8, 5.2, C.lightGray);

/* ══════════════════════════════════════════════════════════════════════════
   13.  FILLING THE BLOCKS
   ══════════════════════════════════════════════════════════════════════════ */
function subdivide(x0,z0,w,d,depth,out){
  if((w<=8 && d<=7) || depth>=4){ out.push([x0,z0,w,d]); return; }
  if(w >= d){
    const cut = Math.max(3, Math.min(w-3, Math.floor(w*(0.38+rnd()*0.24))));
    subdivide(x0,z0,cut,d,depth+1,out); subdivide(x0+cut,z0,w-cut,d,depth+1,out);
  } else {
    const cut = Math.max(3, Math.min(d-3, Math.floor(d*(0.38+rnd()*0.24))));
    subdivide(x0,z0,w,cut,depth+1,out); subdivide(x0,z0+cut,w,d-cut,depth+1,out);
  }
}
function zoneOf(x,z){
  const rt = RTOP[Math.max(0,Math.min(N-1,x))];
  if(z > RBOT[Math.max(0,Math.min(N-1,x))]) return 'south';
  if(x >= 60 && z >= 12 && z < rt) return 'city';
  if(x >= 14 && x <= 62 && z >= 12) return 'central';
  return 'outer';
}
function fillBlocks(density){
  const lots = rectsOf((x,z)=>G[gi(x,z)]===FREE);
  for(const [lx,lz,lw,ld] of lots){
    const x0 = lx+1, z0 = lz+1, w = lw-2, d = ld-2;
    if(w < 3 || d < 3) continue;
    const pieces = [];
    subdivide(x0,z0,w,d,0,pieces);
    for(const [bx0,bz0,bw,bd] of pieces){
      if(bw < 2 || bd < 2) continue;
      if(rnd()*100 > density){ square(bx0,bz0,bw,bd, GY); continue; }
      const zn = zoneOf(bx0+bw/2 | 0, bz0+bd/2 | 0);
      const r = rnd();
      const long = Math.max(bw,bd) >= 5 && Math.min(bw,bd) <= 4;
      if(zn === 'city'){
        if(r < 0.52 && bw>=3 && bd>=3) glassTower(bx0,bz0,bw,bd, GY, 9, 19);
        else if(r < 0.88) mansion(bx0,bz0,bw,bd, GY, 6, 11);
        else square(bx0,bz0,bw,bd, GY);
      } else if(zn === 'central'){
        if(r < 0.34 && long) terrace(bx0,bz0,bw,bd, GY);
        else if(r < 0.74) mansion(bx0,bz0,bw,bd, GY, 4, 7);
        else if(r < 0.79 && bw>=3 && bd>=3) glassTower(bx0,bz0,bw,bd, GY, 6, 9);
        else if(r < 0.87 && bw>=3 && bd>=3) pub(bx0,bz0,bw,bd, GY);
        else if(r < 0.93 && bw>=3 && bd>=4) church(bx0,bz0,bw,bd, GY);
        else square(bx0,bz0,bw,bd, GY);
      } else if(zn === 'south'){
        if(r < 0.42) terrace(bx0,bz0,bw,bd, GY);
        else if(r < 0.72) mansion(bx0,bz0,bw,bd, GY, 3, 6);
        else if(r < 0.79 && bw>=3 && bd>=3) glassTower(bx0,bz0,bw,bd, GY, 5, 9);
        else if(r < 0.87 && bw>=3 && bd>=3) pub(bx0,bz0,bw,bd, GY);
        else if(r < 0.93 && bw>=3 && bd>=4) church(bx0,bz0,bw,bd, GY);
        else square(bx0,bz0,bw,bd, GY);
      } else {
        if(r < 0.60) terrace(bx0,bz0,bw,bd, GY);
        else if(r < 0.80) mansion(bx0,bz0,bw,bd, GY, 3, 5);
        else if(r < 0.88 && bw>=3 && bd>=3) pub(bx0,bz0,bw,bd, GY);
        else square(bx0,bz0,bw,bd, GY);
      }
    }
  }
}

function plantParks(){
  const lake = (x0,z0,w,d)=>{
    br(x0,z0,w,d, 0, WY, C.thames, {gap:0});
    for(let i=0;i<w;i++){ if(rnd()<0.4) continue;

function furnish(){
  for(let z=1;z<N-1;z++) for(let x=1;x<N-1;x++){
    const v = G[gi(x,z)];
    if((v!==FREE && v!==QUAY) || FOOT[gi(x,z)]) continue;
    let nearRoad = false;
    for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const u = gget(x+a,z+b); if(u===ROAD || u===BRIDGE){ nearRoad = true; break; }
    }
    if(!nearRoad && v!==QUAY) continue;
    const X = wx(x)+0.5, Z = wx(z)+0.5, r = rnd();
    if(r < 0.10){ lampPost(X, GY, Z); mark(x,z,1,1); }
    else if(r < 0.155){ planeTree(x+0.5, z+0.5, GY, 0.7+rnd()*0.4); mark(x,z,1,1); }
    else if(r < 0.170){ phoneBox(X, GY, Z); mark(x,z,1,1); }
    else if(r < 0.182){ postBox(X, GY, Z); mark(x,z,1,1); }
    else if(r < 0.194){ tubeSign(X, GY, Z, rnd()<0.5?0:Math.PI/2); mark(x,z,1,1); }
    else if(r < 0.210){ busStop(X, GY, Z); mark(x,z,1,1); }
    else if(r < 0.226){ bench(X, GY, Z, rnd()<0.5?0:1); mark(x,z,1,1); }
  }
  // signals on the intersection corners
  for(const [z0,h] of HROADS) for(const [x0,w] of VROADS){
    for(const [cx0,cz0,f] of [[x0-1,z0-1,0],[x0+w,z0+h,0]]){
      if(!inB(cx0,cz0)) continue;
      const v = G[gi(cx0,cz0)];
      if((v===FREE || v===PARK || v===QUAY) && !FOOT[gi(cx0,cz0)]){
        trafficSignal(wx(cx0)+0.5, GY, wx(cz0)+0.5, f); mark(cx0,cz0,1,1);
      }
    }
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   14.  MOTION  —  paths, vehicles, pedestrians, birds, boats
   ══════════════════════════════════════════════════════════════════════════ */
let LG = null;                                  // holds all one-off meshes

function dp(ch,prim,ag,p,s,c,rot,sw){
  const k = ch+'|'+prim, a = DB[k] || (DB[k] = []);
  const q = new THREE.Quaternion();
  if(rot) q.setFromEuler(new THREE.Euler(rot[0],rot[1],rot[2]));
  a.push({ag:ag, vp:new THREE.Vector3(p[0],p[1],p[2]), vs:new THREE.Vector3(s[0],s[1],s[2]),
          c:c, q:q, sw:sw, piv: sw ? new THREE.Vector3(sw.piv[0],sw.piv[1],sw.piv[2]) : null});
}
function mkPath(pts){
  const P = pts.map(p=>[p[0],p[1]]), seg = [], cum = [0];
  let total = 0;
  for(let i=0;i<P.length;i++){
    const a = P[i], b = P[(i+1)%P.length];
    const L = Math.hypot(b[0]-a[0], b[1]-a[1]);
    seg.push(L); total += L; cum.push(total);
  }
  return {P:P, seg:seg, cum:cum, len:total};
}
function samplePath(pa, s){
  s = ((s % pa.len) + pa.len) % pa.len;
  let i = 0; while(i < pa.seg.length-1 && pa.cum[i+1] <= s) i++;
  const t = pa.seg[i] > 0 ? (s - pa.cum[i]) / pa.seg[i] : 0;
  const a = pa.P[i], b = pa.P[(i+1)%pa.P.length];
  return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, Math.atan2(b[0]-a[0], b[1]-a[1])];
}
const roadish = (x,z)=>{ const v = gget(x,z); return v===ROAD || v===BRIDGE; };
/* is the whole run of carriageway between two junctions actually there? */
function bandH(xa,xb,zBand){
  for(let x=Math.min(xa,xb); x<=Math.max(xa,xb); x++)
    for(let k=0;k<RW;k++) if(!roadish(x, zBand+k)) return false;
  return true;
}
function bandV(za,zb,xBand){
  for(let z=Math.min(za,zb); z<=Math.max(za,zb); z++)
    for(let k=0;k<RW;k++) if(!roadish(xBand+k, z)) return false;
  return true;
}
/* rectangular circuit through four junctions. dir +1 runs clockwise on the map;
   with UK left-hand traffic that puts you on the outer lane, so the offset
   grows the rectangle. dir -1 runs anticlockwise on the inner lane.        */
function makeLoop(cx0,cz0,cx1,cz1,dir,off){
  const e = dir>0 ? off : -off;
  const a0 = cx0-e, a1 = cx1+e, b0 = cz0-e, b1 = cz1+e;
  return mkPath(dir>0 ? [[a0,b0],[a1,b0],[a1,b1],[a0,b1]]
                      : [[a0,b1],[a1,b1],[a1,b0],[a0,b0]]);
}
let VLOOPS = [], PLOOPS = [];
function buildLoops(){
  VLOOPS = []; PLOOPS = [];
  const LANE = RW/4;              // 0.75 — middle of each lane
  const PAVE = RW/2 + 0.5;        // 2.0  — the pavement outside the kerb
  for(let i=0;i<HROADS.length-1;i++) for(let j=0;j<VROADS.length-1;j++){
    const zb0 = HROADS[i][0], zb1 = HROADS[i+1][0];
    const xb0 = VROADS[j][0], xb1 = VROADS[j+1][0];
    if(!bandH(xb0,xb1,zb0) || !bandH(xb0,xb1,zb1)) continue;
    if(!bandV(zb0,zb1,xb0) || !bandV(zb0,zb1,xb1)) continue;
    const cx0 = wx(xb0)+RW/2, cx1 = wx(xb1)+RW/2;
    const cz0 = wx(zb0)+RW/2, cz1 = wx(zb1)+RW/2;
    VLOOPS.push(makeLoop(cx0,cz0,cx1,cz1, 1, LANE), makeLoop(cx0,cz0,cx1,cz1,-1, LANE));
    PLOOPS.push(makeLoop(cx0,cz0,cx1,cz1, 1, PAVE), makeLoop(cx0,cz0,cx1,cz1,-1, PAVE));
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   15.  MESH ASSEMBLY
   ══════════════════════════════════════════════════════════════════════════ */
let cityGroup = null, MESH = {}, PIECES = 0;
const _c = new THREE.Color();
function assemble(){
  MESH = {}; PIECES = 0;
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(),
        e = new THREE.Euler(), v = new THREE.Vector3(), s = new THREE.Vector3();
  for(const src of [SB, DB]){
    const dyn = (src === DB);
    for(const k in src){
      const list = src[k], prim = k.split('|')[1], ch = k.split('|')[0];
      if(!list.length) continue;
      const mesh = new THREE.InstancedMesh(GEO[prim], MAT[ch], list.length);
      mesh.castShadow = !SHADOWLESS[ch];
      mesh.receiveShadow = true;
      mesh.frustumCulled = false;
      for(let i=0;i<list.length;i++){
        const it = list[i];
        if(!dyn){
          if(it.rot){ e.set(it.rot[0],it.rot[1],it.rot[2]); q.setFromEuler(e); } else q.set(0,0,0,1);
          m4.compose(v.set(it.p[0],it.p[1],it.p[2]), q, s.set(it.s[0],it.s[1],it.s[2]));
          mesh.setMatrixAt(i, m4);
        }
        mesh.setColorAt(i, _c.setHex(it.c));
      }
      mesh.instanceMatrix.needsUpdate = true;
      if(mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
      if(dyn) mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      MESH[k] = mesh; cityGroup.add(mesh);
      PIECES += list.length;
    }
  }
  // remember daylight window colours
  for(const r of WINDOWS) r.day = SB[r.k][r.i].c;
}

/* per-frame transform of every moving piece */
const _M = new THREE.Matrix4(), _L = new THREE.Matrix4(), _R = new THREE.Matrix4(),
      _T = new THREE.Matrix4(), _SC = new THREE.Matrix4(), _W = new THREE.Matrix4(),
      _q2 = new THREE.Quaternion(), _e2 = new THREE.Euler(), _one = new THREE.Vector3(1,1,1),
      _qa = new THREE.Quaternion(), _ea = new THREE.Euler();
function moveAgents(dt, T){
  for(const a of AGENTS){
    if(a.kind === 'veh' || a.kind === 'ped' || a.kind === 'boat'){
      a.s += a.spd * dt;
      const [px,pz,hd] = samplePath(a.path, a.s);
      a.pos.set(px, a.y, pz);
      let dY = hd - a.yaw;
      while(dY >  Math.PI) dY -= 2*Math.PI;
      while(dY < -Math.PI) dY += 2*Math.PI;
      a.yaw += dY * Math.min(1, dt * (a.kind==='boat' ? 2.0 : 7.0));
      if(a.kind === 'ped') a.pos.y = a.y + Math.abs(Math.sin(T*9.0 + a.phase))*0.055;
      if(a.kind === 'boat'){
        a.pos.y = a.y + Math.sin(T*1.4 + a.phase)*0.045;
        a.roll = Math.sin(T*1.1 + a.phase)*0.035;
      }
    } else if(a.kind === 'bird'){
      a.ang += a.spd * dt;
      a.pos.set(a.cx + Math.cos(a.ang)*a.r,
                a.cy + Math.sin(T*1.3 + a.phase)*a.bobA,
                a.cz + Math.sin(a.ang)*a.r);
      a.yaw = -a.ang + (a.spd>0 ? Math.PI/2 : -Math.PI/2);
      a.roll = (a.spd>0 ? -0.42 : 0.42);
      a.pitch = Math.cos(T*1.3 + a.phase)*0.12;
    }
  }
  for(const k in DB){
    const list = DB[k], mesh = MESH[k];
    if(!mesh) continue;
    for(let i=0;i<list.length;i++){
      const it = list[i], a = it.ag;
      _ea.set(a.pitch||0, a.yaw||0, a.roll||0);
      _qa.setFromEuler(_ea);
      _M.compose(a.pos, _qa, _one);
      if(it.sw){
        const ang = it.sw.amp * Math.sin(T*it.sw.rate + (a.phase||0));
        _e2.set(it.sw.ax==='x'?ang:0, it.sw.ax==='y'?ang:0, it.sw.ax==='z'?ang:0);
        _q2.setFromEuler(_e2);
        _L.makeTranslation(it.piv.x, it.piv.y, it.piv.z);
        _R.makeRotationFromQuaternion(_q2); _L.multiply(_R);
        _T.makeTranslation(it.vp.x-it.piv.x, it.vp.y-it.piv.y, it.vp.z-it.piv.z); _L.multiply(_T);
        _SC.makeScale(it.vs.x, it.vs.y, it.vs.z); _L.multiply(_SC);
      } else {
        _L.compose(it.vp, it.q, it.vs);
      }
      _W.multiplyMatrices(_M, _L);
      mesh.setMatrixAt(i, _W);
    }
    mesh.instanceMatrix.needsUpdate = true;
  }
  // one-off animated props
  for(const s of SPECIAL){
    if(s.kind === 'eye'){
      s.wheel.rotation.x = T * 0.075;
      for(let i=0;i<s.pods.length;i++){
        const a = T*0.075 + i*Math.PI*2/s.pods.length;
        s.pods[i].position.set(s.hub.x, s.hub.y + Math.cos(a)*s.R, s.hub.z + Math.sin(a)*s.R);
      }
    } else if(s.kind === 'clock'){
      s.min.rotation.z  = -T * 0.30;
      s.hour.rotation.z = -T * 0.025;
    }
  }
  // traffic signals
  const step = Math.floor(T * 0.42) % 4;
  for(const tl of TLIGHTS){
    const ph = (step + tl.phase) % 4;
    const on = [ph===0||ph===3, ph===1||ph===3, ph===2];
    const cols = [ph===0||ph===3 ? 0xff2d16 : 0x4a0f0a,
                  ph===1||ph===3 ? 0xffc21a : 0x4a3a08,
                  ph===2 ? 0x2ecc40 : 0x0d3316];
    for(let i=0;i<3;i++){
      const r = tl.lamps[i], mesh = MESH[r.k];
      if(mesh){ mesh.setColorAt(r.i, _c.setHex(cols[i])); mesh._dirty = true; }
    }
  }
  for(const k in MESH) if(MESH[k]._dirty && MESH[k].instanceColor){
    MESH[k].instanceColor.needsUpdate = true; MESH[k]._dirty = false;
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   16.  DAY / NIGHT
   ══════════════════════════════════════════════════════════════════════════ */
let isNight = false, pointLights = [];
function applyTime(){
  scene.background  = isNight ? SKY.night   : SKY.day;
  scene.environment = isNight ? SKY.nightEnv : SKY.dayEnv;
  scene.fog = isNight ? new THREE.FogExp2(0x101c30, 0.0028)
                      : new THREE.FogExp2(0xb7d0e4, 0.0011);
  if(isNight){
    sun.position.copy(MOONDIR).multiplyScalar(150);
    sun.color.setHex(0xa9c2ff); sun.intensity = 0.38;
    hemi.color.setHex(0x2c4470); hemi.groundColor.setHex(0x0d1420); hemi.intensity = 0.16;
    amb.intensity = 0.02; rim.intensity = 0.05;
    renderer.toneMappingExposure = 1.15 * EXPOSURE;
  } else {
    sun.position.copy(SUNDIR).multiplyScalar(150);
    sun.color.setHex(0xfff3dc); sun.intensity = 1.30;
    hemi.color.setHex(0xcfe6f7); hemi.groundColor.setHex(0x6d8a58); hemi.intensity = 0.10;
    amb.intensity = 0.0; rim.intensity = 0.10;
    renderer.toneMappingExposure = 1.00 * EXPOSURE;
  }
  // glazing glows after dark
  for(const m of [MAT.glass, MAT.dynG]){
    m.emissive.setHex(isNight ? 0xffcf88 : 0x000000);
    m.emissiveIntensity = isNight ? 0.62 : 0;
  }
  MAT.water.color.setHex(0xffffff);
  MAT.water.envMapIntensity = isNight ? 3.1 : 2.3;
  // vary which windows are lit
  const gm = MESH['glass|box'];
  if(gm){
    for(const r of WINDOWS){
      if(r.k !== 'glass|box') continue;
      if(isNight){
        const h = ((r.i*2654435761)>>>0) % 100;
        gm.setColorAt(r.i, _c.setHex(h > 26 ? (h%3===0 ? 0xffdf9e : 0xfff3cf) : 0x24303f));
      } else gm.setColorAt(r.i, _c.setHex(r.day));
    }
    if(gm.instanceColor) gm.instanceColor.needsUpdate = true;
  }
  // a handful of hero point lights
  for(const l of pointLights) scene.remove(l);
  pointLights = [];
  if(isNight){
    const hero = NIGHTLAMPS.filter(l=>l[4] >= 0.85).slice(0, 14);
    for(const [x,y,z,col,inten] of hero){
      const pl = new THREE.PointLight(col, inten*2.2, 26, 2);
      pl.position.set(x,y,z); scene.add(pl); pointLights.push(pl);
    }
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   17.  SURROUNDINGS  —  countryside plane + distant hills
   ══════════════════════════════════════════════════════════════════════════ */
function buildSurroundings(){
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#5d8a4a'; g.fillRect(0,0,256,256);
  seed(777);
  for(let i=0;i<600;i++){
    const x = rnd()*256, y = rnd()*256, r = 6+rnd()*34;
    g.fillStyle = 'rgba('+(70+rnd()*60|0)+','+(115+rnd()*55|0)+','+(58+rnd()*40|0)+',0.4)';
    g.beginPath(); g.ellipse(x,y,r,r*(0.4+rnd()*0.8),rnd()*3,0,6.2832); g.fill();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(70,70); tex.encoding = THREE.sRGBEncoding;
  const land = new THREE.Mesh(new THREE.PlaneGeometry(1600,1600),
    new THREE.MeshStandardMaterial({map:tex, roughness:0.92, metalness:0}));
  land.rotation.x = -Math.PI/2; land.position.y = -PLATE - 0.01;
  land.receiveShadow = true;
  scene.add(land);
  // distant hills
  seed(31337);
  for(let i=0;i<40;i++){
    const a = rnd()*6.2832, d = 150 + rnd()*300;
    const h = new THREE.Mesh(new THREE.SphereGeometry(1,12,8),
      new THREE.MeshStandardMaterial({color:new THREE.Color().setHSL(0.28+rnd()*0.08, 0.24, 0.30+rnd()*0.14),
                                      roughness:0.95}));
    h.position.set(Math.cos(a)*d, -PLATE-2, Math.sin(a)*d);
    h.scale.set(30+rnd()*90, 7+rnd()*22, 30+rnd()*90);
    scene.add(h);
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   18.  CAMERA  —  orbit + landmark fly-to
   ══════════════════════════════════════════════════════════════════════════ */
const cam = {tgt:new THREE.Vector3(0,6,4), r:130, theta:0.72, phi:1.06};
let fly = null, autoSpin = true, drag = null, motionOn = true;
function updateCam(){
  cam.phi = Math.max(0.10, Math.min(1.54, cam.phi));
  cam.r   = Math.max(14, Math.min(400, cam.r));
  const sp = Math.sin(cam.phi);
  camera.position.set(cam.tgt.x + cam.r*sp*Math.sin(cam.theta),
                      cam.tgt.y + cam.r*Math.cos(cam.phi),
                      cam.tgt.z + cam.r*sp*Math.cos(cam.theta));
  camera.lookAt(cam.tgt);
}
function flyTo(t){
  fly = {t:0, from:{tgt:cam.tgt.clone(), r:cam.r, theta:cam.theta, phi:cam.phi},
         to:{tgt:new THREE.Vector3(t.at[0],t.at[1],t.at[2]), r:t.r, theta:t.theta, phi:t.phi}};
  autoSpin = false; document.getElementById('spin').classList.remove('on');
}
const dom = renderer.domElement;
dom.addEventListener('pointerdown', e=>{
  dom.setPointerCapture(e.pointerId);
  drag = {x:e.clientX, y:e.clientY, pan:(e.button===2 || e.shiftKey)};
  fly = null; autoSpin = false; document.getElementById('spin').classList.remove('on');
});
dom.addEventListener('pointermove', e=>{
  if(!drag) return;
  const dx = e.clientX-drag.x, dy = e.clientY-drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if(drag.pan){
    const right = new THREE.Vector3().subVectors(camera.position, cam.tgt).cross(camera.up).normalize();
    const fwd = new THREE.Vector3().subVectors(cam.tgt, camera.position).setY(0).normalize();
    cam.tgt.addScaledVector(right, -dx*cam.r*0.0011);
    cam.tgt.addScaledVector(fwd,   -dy*cam.r*0.0011);
  } else { cam.theta -= dx*0.0055; cam.phi -= dy*0.0045; }
  updateCam();
});
addEventListener('pointerup', ()=>{ drag = null; });
dom.addEventListener('contextmenu', e=>e.preventDefault());
dom.addEventListener('wheel', e=>{ e.preventDefault(); fly=null; cam.r *= Math.pow(1.0016, e.deltaY); updateCam(); }, {passive:false});
let pinch = null;
dom.addEventListener('touchstart', e=>{ if(e.touches.length===2)
  pinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }, {passive:true});
dom.addEventListener('touchmove', e=>{ if(e.touches.length===2 && pinch){
  const d2 = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  cam.r *= pinch/d2; pinch = d2; updateCam(); }}, {passive:true});
dom.addEventListener('touchend', ()=>{ pinch = null; });

/* ══════════════════════════════════════════════════════════════════════════
   19.  BUILD / REBUILD
   ══════════════════════════════════════════════════════════════════════════ */
function generate(){
  if(cityGroup){
    cityGroup.traverse(o=>{ if(o.isMesh && o.material && o.material !== MAT.body) {} });
    scene.remove(cityGroup);
  }
  for(const l of pointLights) scene.remove(l);
  pointLights = [];
  cityGroup = new THREE.Group(); scene.add(cityGroup);
  LG = cityGroup;

  resetBuffers();
  const density = +document.getElementById('density').value;
  seed((Math.random()*1e9)|0);
  buildMap();
  TOURS.length = 0;
  buildParliament(); buildEye(); buildTowerBridge(); buildStPauls();
  buildGherkin(); buildCityCluster(); buildShard(); buildTowerOfLondon();
  buildAbbey(); buildBuckingham(); buildTrafalgar(); buildBTandPiccadilly();
  buildBattersea(); buildBridges();
  fillBlocks(density);
  plantParks();
  furnish();
  buildGround();
  spawnMotion();
  assemble();
  applyTime();
  buildTourUI();
  document.getElementById('stats').innerHTML =
    PIECES.toLocaleString()+' bricks<br>'+AGENTS.length+' things moving';
}
function buildTourUI(){
  const host = document.getElementById('tours');
  host.innerHTML = '';
  const all = [{name:'Overview', at:[0,6,4], r:130, theta:0.72, phi:1.06}].concat(TOURS);
  for(const t of all){
    const b = document.createElement('button');
    b.className = 'tour'; b.textContent = t.name;
    b.onclick = ()=>flyTo(t);
    host.appendChild(b);
  }
}

/* ── UI wiring ── */
document.getElementById('regen').onclick = generate;
document.getElementById('night').onclick = e=>{
  isNight = !isNight;
  e.currentTarget.classList.toggle('on', isNight);
  e.currentTarget.textContent = isNight ? '☀︎ Day' : '🌙 Night';
  applyTime();
};
document.getElementById('spin').onclick = e=>{
  autoSpin = !autoSpin; e.currentTarget.classList.toggle('on', autoSpin); fly = null;
};
document.getElementById('traffic').onclick = e=>{
  motionOn = !motionOn; e.currentTarget.classList.toggle('on', motionOn);
};
let dTimer;
document.getElementById('density').oninput = ()=>{ clearTimeout(dTimer); dTimer = setTimeout(generate, 260); };
document.getElementById('exposure').oninput = e=>{
  EXPOSURE = +e.target.value / 100;
  renderer.toneMappingExposure = (isNight ? 1.15 : 1.00) * EXPOSURE;
};
addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ══════════════════════════════════════════════════════════════════════════
   20.  GO
   ══════════════════════════════════════════════════════════════════════════ */
initSky();
buildSurroundings();
generate();
updateCam();

const boot = document.getElementById('boot');
boot.style.opacity = '0';
setTimeout(()=>boot.remove(), 600);

let last = performance.now(), T = 0, fpsT = 0, fpsN = 0, fps = 0;
function loop(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  T += dt;
  if(motionOn) moveAgents(dt, T);
  if(fly){
    fly.t = Math.min(1, fly.t + dt*0.75);
    const k = fly.t<0.5 ? 4*fly.t**3 : 1-Math.pow(-2*fly.t+2,3)/2;   // ease in-out
    cam.tgt.lerpVectors(fly.from.tgt, fly.to.tgt, k);
    cam.r     = fly.from.r     + (fly.to.r     - fly.from.r)*k;
    cam.theta = fly.from.theta + (fly.to.theta - fly.from.theta)*k;
    cam.phi   = fly.from.phi   + (fly.to.phi   - fly.from.phi)*k;
    updateCam();
    if(fly.t >= 1) fly = null;
  } else if(autoSpin && !drag){ cam.theta += dt*0.035; updateCam(); }
  renderer.render(scene, camera);
  fpsN++; fpsT += dt;
  if(fpsT > 1){ fps = Math.round(fpsN/fpsT); fpsN = 0; fpsT = 0;
    const s = document.getElementById('stats');
    s.innerHTML = PIECES.toLocaleString()+' bricks<br>'+AGENTS.length+' things moving<br>'+fps+' fps';
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
